type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  code:
    type: string
  updateVersion:
    type: string
  severity:
    type: string
  type:
    type: string
  description:
    type: string
  zeroDowntime:
    type: boolean
  requiresReboot:
    type: boolean
  requiresRestart:
    type: boolean
  requiresMaintenanceMode:
    type: boolean
  supportsRollback:
    type: boolean
  updateReleaseDate:
    type:
      - string
      - 'null'
    format: date-time
