type: object
description: A captured Host Configuration Profile for an MVM host.
properties:
  id:
    type: integer
    format: int64
    description: The unique ID of the configuration profile.
  serverId:
    type: integer
    format: int64
    description: The ID of the host (server) this profile was captured from.
  name:
    type: string
    description: Unique name for the profile.
  description:
    type:
      - string
      - 'null'
    description: Optional description for the profile.
  createdBy:
    type:
      - object
      - 'null'
    description: The user that captured the profile.
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
  dateCreated:
    type: string
    format: date-time
    description: The date the profile was captured.
  lastUpdated:
    type: string
    format: date-time
    description: The date the profile metadata was last updated.
  config:
    type: object
    description: The full serialized host configuration JSON captured for this profile.
    additionalProperties: true

