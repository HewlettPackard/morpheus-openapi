type: object
properties:
  instance:
    type: object
    description: The map containing the id of the service plan you wish to apply to the containers in this instance.
    properties:
      id:
        type: integer
        format: int64
        example: 123
        description: The id of the instance to resize.
      plan:
        type: object
        properties:
          id:
            type: integer
            format: int64
            example: 75
      config:
        type: object
        additionalProperties: true
        description: Reconfigure option values for the provision type. Must be an object or null; any other type returns 400. Merged with the top-level `config`, which takes precedence.
  config:
    type: object
    additionalProperties: true
    description: Reconfigure option values. Must be an object or null; any other type returns 400. Takes precedence over `instance.config`.
  servicePlanId:
    type: integer
    format: int64
    example: 75
    description: >-
      Service plan ID to apply to the instance when `instance.plan.id` is not supplied. `servicePlan` is
      accepted as an alias. When omitted, the instance's current service plan is preserved.
  servicePlanOptions:
    $ref: servicePlanOptions.yaml
  volumes:
    type: array
    description: Can be used to grow just the logical volume of the instance instead of choosing a plan
    items:
      $ref: instanceCreateVolume.yaml
  storageControllers:
    type: array
    description: |
      Optional array of storage controller configurations representing the full desired controller state
      of the instance after resize. Include every existing controller (by `id`) that should be preserved,
      plus any new controllers to add. Existing controllers omitted from the array are treated as deletes;
      controllers with volumes attached cannot be deleted and will fail the resize.

      Must be sent alongside the `volumes` array in the same request — controller changes are only
      processed when `volumes` is present in the payload. Supported on VMware and MVM.
    items:
      $ref: instanceCreateStorageController.yaml
  storageController:
    type: array
    description: Singular alias for `storageControllers`. Takes precedence when both are supplied.
    items:
      $ref: instanceCreateStorageController.yaml
  deleteOriginalVolumes:
    type: boolean
    description: >-
      Delete the original volumes after resizing when the provision type copies volumes to new backing
      disks (`resizeCopiesVolumes`, e.g. Amazon and Alibaba).
    default: false
  networkInterfaces:
    type: array
    description: Key for network configuration. Include id to update an existing interface. The existing interfaces and their id can be retrieved with the hosts API.
    items:
      $ref: instanceCreateNetwork.yaml
  servers:
    type: array
    description: |
      Optional per-node resize payloads for a multi-node instance whose nodes have drifted
      apart. Use this instead of the flat `volumes` / `storageControllers` /
      `networkInterfaces` / plan fields when the nodes no longer share an identical
      configuration and need to be reconfigured individually.

      The per-node path is taken whenever the `servers` key is present in the request body,
      even when only a single edited node is included. It must be a non-empty array of
      objects with unique positive `containerId` values belonging to the instance (not
      supported on Azure Scale Set instances). Entries whose configuration matches the
      node's current recorded state are filtered out automatically; if no node has
      effective changes, the endpoint returns `200` immediately without dispatching a
      resize.

      All changed entries are validated before any are applied. Permission, plan-resolution,
      resource validation, shared-volume consistency, and drift checks run for every node
      first, and the first failure aborts the entire request without resizing any node.
      Once validation passes, each changed node's resize is dispatched with its own
      per-node options.

      Edits or deletions of a shared volume (`isShared: true` / matching `sharedVolumeId`)
      must agree across every attached server in the instance; a mismatch fails the request
      with `Shared disk edits or deletions must agree across all attached servers`. A node
      whose configuration is still detected as drifted from its provider state fails with
      `gomorpheus.error.instance.driftedResizeNotAllowed`.
    items:
      $ref: instanceResizeServer.yaml
