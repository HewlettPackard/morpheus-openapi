type: object
properties:
  instance:
    type: object
    description: The map containing the id of the service plan you wish to apply to the containers in this instance.
    properties:
      id:
        type: integer
        format: int64
        example: 123
        description: The id of the instance to resize.
      plan:
        type: object
        properties:
          id:
            type: integer
            format: int64
            example: 75
      config:
        type: object
        additionalProperties: true
        description: Reconfigure option values for the provision type. Must be an object or null; any other type returns 400. Merged with the top-level `config`, which takes precedence.
  config:
    type: object
    additionalProperties: true
    description: Reconfigure option values. Must be an object or null; any other type returns 400. Takes precedence over `instance.config`.
  servicePlanOptions:
    $ref: servicePlanOptions.yaml
  volumes:
    type: array
    description: Can be used to grow just the logical volume of the instance instead of choosing a plan
    items:
      $ref: instanceCreateVolume.yaml
  storageControllers:
    type: array
    description: |
      Optional array of storage controller configurations representing the full desired controller state
      of the instance after resize. Include every existing controller (by `id`) that should be preserved,
      plus any new controllers to add. Existing controllers omitted from the array are treated as deletes;
      controllers with volumes attached cannot be deleted and will fail the resize.

      Must be sent alongside the `volumes` array in the same request — controller changes are only
      processed when `volumes` is present in the payload. Supported on VMware and MVM.
    items:
      $ref: instanceCreateStorageController.yaml
  deleteOriginalVolumes:
    type: boolean
    description: Delete the original volumes after resizing. (Amazon only)
    default: false
  networkInterfaces:
    type: array
    description: Key for network configuration. Include id to update an existing interface. The existing interfaces and their id can be retrieved with the hosts API.
    items:
      $ref: instanceCreateNetwork.yaml
  servers:
    type: array
    description: |
      Optional per-node resize payloads for a multi-node instance whose nodes have drifted
      apart. Use this instead of the flat `volumes` / `storageControllers` /
      `networkInterfaces` / plan fields when the nodes no longer share an identical
      configuration and need to be reconfigured individually.

      The per-node path is taken only when this array contains **more than one** entry. A
      request with zero or one entry is processed through the flat path, where the
      top-level fields apply uniformly to every node.

      All entries are validated before any are applied. Permission, plan-resolution,
      validation and drift checks run for every node first, and the first failure aborts
      the entire request without resizing any node — so the call is never partially
      validated. Once validation passes, each node's resize is dispatched independently.

      A node whose configuration is still detected as drifted after the submitted edits are
      applied fails the request with `gomorpheus.error.instance.driftedResizeNotAllowed`.
    items:
      $ref: instanceResizeServer.yaml
