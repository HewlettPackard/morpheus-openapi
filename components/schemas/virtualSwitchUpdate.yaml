type: object
description: >-
  Request body for updating a virtual switch. `baseType` is immutable; supplying
  a different value is rejected.
properties:
  name:
    type: string
    description: >-
      Switch name. Limited to 16 characters, matching the switch domain
      constraint and the service name-length limit.
    maxLength: 16
    example: vswitch01
  description:
    type: string
    example: Updated description
  bondMode:
    type: string
    description: >-
      NIC bonding mode. The literal `none` may also be supplied to explicitly
      clear the bond mode.
    enum:
      - active-backup
      - 802.3ad
      - none
    example: 802.3ad
  mtu:
    type: integer
    enum:
      - 1500
      - 9000
    example: 9000
  uplinks:
    type: array
    description: Optional revised per-host NIC assignments.
    items:
      $ref: ./virtualSwitchUplinkAssignment.yaml
