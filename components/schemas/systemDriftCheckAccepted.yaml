type: object
description: |
  Accepted snapshot, not an execution verdict. A newly dispatched check returns a persisted
  report and process ID. A detected in-flight check may return a null report and process ID,
  or a visible report whose process ID is not yet populated.
properties:
  success:
    type: boolean
  driftReport:
    oneOf:
      - $ref: systemDriftReport.yaml
      - type: 'null'
  processId:
    type:
      - integer
      - 'null'
    format: int64
  msg:
    type: string
    description: Present when an existing check was detected; concurrent POSTs are not guaranteed to coalesce
