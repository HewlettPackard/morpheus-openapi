type: object
properties:
  name:
    type: string
  description:
    type:
      - string
      - 'null'
  sudoUser:
    type: boolean
  serverGroup:
    type:
      - string
      - 'null'
  users:
    type: array
    description: |
      Users in the group. Accepts bare user ids (string or integer) and/or `{ id }`
      objects (string or int id).
    items:
      oneOf:
        - type: integer
          format: int64
        - type: string
        - type: object
          properties:
            id:
              oneOf:
                - type: integer
                  format: int64
                - type: string
    example:
      - id: "100"
      - id: "101"
