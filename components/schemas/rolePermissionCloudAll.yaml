type: object
required:
  - allClouds
  - access
properties:
  allClouds:
    type: boolean
    description: "Apply to all clouds"
  all:
    type: boolean
    description: Alias for `allClouds`
  access:
    type: string
    description: The new access level.
    enum:
      - default
      - full
      - read
      - none