type: object
description: License type from ProvisioningLicenseTypesController (`_licenseType.gson`).
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  code:
    type: string
  description:
    type:
      - string
      - 'null'
  visibility:
    description: Domain visibility value
    oneOf:
      - type: string
      - type: boolean
      - type: 'null'
  account:
    type:
      - object
      - 'null'
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
