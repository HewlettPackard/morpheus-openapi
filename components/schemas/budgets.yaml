type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  description:
    type:
      - string
      - 'null'
  account:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  forecastType:
    type:
      - object
      - 'null'
    description: Forecast Model type
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  enabled:
    type: boolean
  refScope:
    type: string
  refType:
    type: string
  refId:
    type: integer
    format: int64
  refName:
    type: string
  period:
    type: string
  year:
    type: string
    description: The budget year, or `custom` for a budget spanning the explicit `startDate`–`endDate` period.
  resourceType:
    type: string
  timezone:
    type: string
  startDate:
    type: string
    format: date-time
  endDate:
    type: string
    format: date-time
  interval:
    type: string
  costs:
    type: array
    description: The budget amount for each interval, in `currency`; one per month, quarter or year of the period according to `interval`.
    items:
      type: number
      format: double
  isFiscal:
    type: boolean
  averageCost:
    type: number
    format: double
    description: >-
      `totalCost` divided by the number of intervals, in `currency`; 0 when there is no total.
  totalCost:
    type:
      - number
      - 'null'
    format: double
    description: The sum of `costs`, in `currency`; null for a budget with no amounts.
  currency:
    type: string
    description: >-
      The currency of the budget's amounts: the account's currency, reported when the budget's
      statistics are loaded (a single budget, or a listing with `stats=true`); `USD` otherwise.
  rollover:
    type: boolean
  warningLimit:
    type:
      - number
      - 'null'
    format: double
    description: The percentage of the budget at which to warn.
  overLimit:
    type:
      - number
      - 'null'
    format: double
    description: The percentage of the budget by which spend may exceed it.
  externalId:
    type:
      - string
      - 'null'
  internalId:
    type:
      - string
      - 'null'
  createdById:
    type: integer
    format: int64
  createdByName:
    type: string
  updatedById:
    type:
      - string
      - 'null'
  updatedByName:
    type:
      - string
      - 'null'
  dateCreated:
    type: string
    format: date-time
  lastUpdated:
    type: string
    format: date-time
  stats:
    type: object
    properties:
      currency:
        type: string
      conversionRate:
        type: number
        format: double
        description: The rate the costs were converted to `currency` at; 1 when no conversion was needed.
      intervals:
        type: array
        items:
          type: object
          properties:
            index:
              type: integer
              format: int64
            month:
              type: string
              description: The month, for a monthly budget.
            quarter:
              type: string
              description: The quarter (`q1`…`q4`), for a quarterly budget.
            quarterName:
              type: string
            year:
              type: string
              description: The year (`Y1`, `Y2`…), for a yearly budget.
            shortYear:
              type: string
            shortName:
              type: string
            chartName:
              type: string
            budget:
              type: number
              format: double
              description: The budgeted amount for the interval, in the budget's currency.
            cost:
              type: number
              format: double
              description: The amount spent in the interval, in the budget's currency.
            forecast:
              type: number
              format: double
              description: >-
                The forecast spend of an interval without actual spend yet (the actual spend where there is
                some); present when the budget has a forecast model.
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
      current:
        type: object
        properties:
          estimatedCost:
            type:
              - number
              - 'null'
            format: double
            description: The estimated spend of the current interval, in `currency`, rounded to two decimals; null when there is no invoice data.
          lastCost:
            type:
              - number
              - 'null'
            format: double
            description: The spend of the previous interval, in `currency`, rounded to two decimals; null when there is no invoice data.
