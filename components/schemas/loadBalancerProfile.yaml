id:
  type: integer
  format: int64
loadBalancer:
  type: object
  properties:
    id:
      type: integer
      format: int64
    type:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
    name:
      type: string
    ip:
      type: string
name:
  type: string
category:
  type: string
serviceType:
  type: string
serviceTypeDisplay:
  type: string
visibility:
  type: string
description:
  type: string
internalId:
  type: string
externalId:
  type: string
proxyType:
  type:
    - string
    - 'null'
redirectRewrite:
  type:
    - string
    - 'null'
persistenceType:
  type:
    - string
    - 'null'
sslEnabled:
  type:
    - string
    - 'null'
sslCert:
  type:
    - string
    - 'null'
accountCertificate:
  type:
    - string
    - 'null'
enabled:
  type: boolean
redirectUrl:
  type:
    - string
    - 'null'
insertXforwardedFor:
  type: boolean
persistenceCookieName:
  type:
    - string
    - 'null'
persistenceExpiresIn:
  type:
    - string
    - 'null'
editable:
  type: boolean
config:
  description: Configuration object with parameters that vary by serviceType.
  anyOf:
    - $ref: loadBalancerProfileConfigHttp.yaml
    - $ref: loadBalancerProfileConfigFastTcp.yaml
    - $ref: loadBalancerProfileConfigFastUdp.yaml
    - $ref: loadBalancerProfileConfigCookiePersistence.yaml
    - $ref: loadBalancerProfileConfigSourceIpPersistence.yaml
    - $ref: loadBalancerProfileConfigGenericPersistence.yaml
    - $ref: loadBalancerProfileConfigClientSsl.yaml
    - $ref: loadBalancerProfileConfigServerSsl.yaml
createdBy:
  type:
    - string
    - 'null'
dateCreated:
  type: string
  format: date-time
lastUpdated:
  type: string
  format: date-time
