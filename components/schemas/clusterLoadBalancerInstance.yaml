type: object
description: >-
  A load balancer virtual server to create for the cluster once it is provisioned. These are the
  entries the Morpheus UI and CLI send with a cluster that takes a load balancer, such as the
  Kubernetes API load balancer of an HKS Hybrid HA layout (port 6443, protocol tcp).
properties:
  enabled:
    type: boolean
    description: Whether to apply this entry. Entries that are not enabled are ignored.
  loadBalancerId:
    type: integer
    format: int64
    description: >-
      The load balancer to create the virtual server on. The built-in ids `-4` (kube-vip), `-3`
      (Azure) and `-2` (Amazon ELB) have Morpheus create a load balancer of that type with the
      cluster.
  loadBalancer:
    type: object
    description: The load balancer, by id. `loadBalancerId` takes precedence when both are given.
    properties:
      id:
        type: integer
        format: int64
  instanceId:
    type: integer
    format: int64
    description: An existing virtual server to update. Omit it, or send `-1`, to create one.
  port:
    type: integer
    description: The virtual server's port. `vipPort` is accepted as well.
  backendPort:
    type: integer
    description: The port on the cluster's nodes. Defaults to `port`.
  vipProtocol:
    type: string
    description: The virtual server's protocol.
    enum:
      - tcp
      - http
      - https
  vipAddress:
    type: string
    description: The virtual IP address. Omit it to lease one from `vipPool`.
  vipPool:
    type: integer
    format: int64
    description: The network pool to lease the virtual IP address from.
  vipShared:
    type: boolean
    description: Whether the virtual IP address is shared. The strings `on` and `off` are accepted as well.
  externalAddress:
    type: boolean
    description: Whether the virtual server is reachable externally. The strings `on` and `off` are accepted as well.
  vipName:
    type: string
    description: The virtual server's name. Defaults to the cluster's name.
  vipHostname:
    type: string
    description: The virtual server's hostname.
  sslCert:
    type: integer
    format: int64
    description: The SSL certificate, by id, for `https`.
  description:
    type: string
additionalProperties: true
