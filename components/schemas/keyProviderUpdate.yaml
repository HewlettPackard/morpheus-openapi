type: object
properties:
  name:
    type: string
    maxLength: 255
  description:
    type: [string, 'null']
    maxLength: 4000
  visibility:
    type: string
    enum: [private, public]
  providerId:
    type: string
    format: uuid
    description: Immutable; if supplied, it must equal the existing providerId.
  type:
    type: string
    description: Immutable after creation.
  refType:
    type: [string, 'null']
    description: Immutable after creation.
  refId:
    type: [integer, 'null']
    format: int64
    description: Immutable after creation.
  tpmRequired:
    type: boolean
    description: Immutable in this API version.
  status:
    type: string
    enum: [pending, exported, active, disabled, deleting]
  exportId:
    type: string
    format: uuid
    description: Latest export ID, required when confirming activation.
