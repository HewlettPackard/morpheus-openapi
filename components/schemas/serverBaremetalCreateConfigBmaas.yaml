title: Bmaas Host Config Object
type: object
description: >
  Configuration for an HPE iLO bare-metal host (hpe-baremetal-plugin
  `IloBareMetalUnmanaged` type). These values identify the physical machine's
  iLO management interface and the resource pool it belongs to.
properties:
  iloIpAddress:
    type: string
    description: IP address of the server's iLO management interface.
    example: 192.168.1.1
  iloUsername:
    type:
      - string
      - 'null'
    description: Username for the iLO management interface.
  iloPassword:
    type:
      - string
      - 'null'
    description: Password for the iLO management interface.
  iloMacAddress:
    type:
      - string
      - 'null'
    description: MAC address of the server's iLO management interface.
    example: "ba:dc:0f:fe:ca:fe"
  resourcePoolId:
    type: string
    description: Identifier of the resource pool this host belongs to.
  preProvisioned:
    type:
      - boolean
      - 'null'
    description: Set to true if the server is already provisioned (brownfield).
  userData:
    type:
      - string
      - 'null'
    description: Cloud-init user data for the host.
  provisionKey:
    type:
      - integer
      - 'null'
    format: int64
    description: The ID of the SSH key pair to assign to the host.
required:
  - iloIpAddress
  - resourcePoolId
