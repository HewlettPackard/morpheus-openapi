type: object
properties:
  name:
    type: string
    description: A name for the new cloned instance. If none is specified the existing name will be duplicated with the 'clone' suffix added.
    example: "my-cloned-instance"
  group:
    type: object
    description: The map containing the id of the server group you would like to clone into. Defaults to the source instance's group.
    properties:
      id:
        type: integer
        format: int64
        description: The id of the server group you would like to clone into.
        example: 2
  cloud:
    type: object
    description: The map containing the id of the cloud you would like to clone into. Defaults to the source instance's cloud.
    properties:
      id:
        type: integer
        format: int64
        description: The id of the cloud to clone into.
        example: 6
  plan:
    type: object
    description: The service plan override for the clone. Defaults to the source instance's service plan.
    properties:
      id:
        type: integer
        format: int64
        description: The id of the service plan (the pre-configured memory and storage option) for the clone.
        example: 75
  volumes:
    type: array
    description: |
      The complete set of volumes for the clone. When provided, this replaces (does not merge with) the source instance's volumes.

      Volume specifications define infrastructure parameters (size, datastore, type) only - the disk contents are always copied from the source instance.
    items:
      $ref: instanceCreateVolume.yaml
  networkInterfaces:
    type: array
    description: |
      The complete set of network interfaces for the clone. When provided, this replaces (does not merge with) the source instance's network interfaces.

      The Options API `/api/options/zoneNetworkOptions?zoneId=5&provisionTypeId=10` can be used to see which options are available.
    items:
      $ref: instanceCreateNetwork.yaml
  config:
    description: |
      Configuration overrides applied when provisioning the clone. Unlike `volumes` and `networkInterfaces` (which replace the source set when provided), `config` is **merged** key-by-key over the source instance's existing configuration: keys you set here override the source value, and keys you omit are inherited from the source instance.

      This does not modify the source instance in any way - the merge happens only on the new clone's configuration at provision time.

      The shape mirrors instance creation, so the same per-cloud configuration options can be supplied. Provide the variant that matches the target cloud type.
    anyOf:
      - $ref: instancesConfigAzure.yaml
      - $ref: instancesConfigVMWare.yaml
      - $ref: instancesConfigGCP.yaml
      - $ref: instancesConfigAWS.yaml
      - $ref: instancesConfigGeneric.yaml
      - $ref: instancesConfigHVM.yaml
