type: object
description: >-
  A single active violation of a required ("must") affinity rule, as reported by
  the violations endpoint.
properties:
  ruleId:
    type: integer
    format: int64
    description: ID of the affinity rule that is being violated
  ruleName:
    type: string
    description: Name of the affinity rule at the time the violation was recorded
  ruleDeleted:
    type: boolean
    description: >-
      True when the rule has since been deleted but the violation record is
      still present
  keepTogether:
    type: boolean
    description: >-
      True when the violated rule is KEEP_TOGETHER, false when it is
      KEEP_SEPARATE
  emptyHostGroup:
    type: boolean
    description: >-
      True when the rule is misconfigured because its Host Group resolves to no
      hosts, so the rule can never be satisfied
  reason:
    type: string
    description: >-
      Localized explanation of why the rule is violated. For a required rule that
      combines a VM group and a Host Group, it names any affected VMs with a pinned
      placement strategy, which blocks automatic eviction
  occurredAt:
    type: string
    format: date-time
    description: When the violation was first observed
  alarmId:
    type:
      - integer
      - 'null'
    format: int64
    description: >-
      ID of the alarm raised for an empty Host Group. Null when the rule is not
      misconfigured
  affectedVms:
    type: array
    description: The virtual machines currently in violation of the rule
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Server ID of the affected VM
        name:
          type: string
          description: Name of the affected VM
        alarmId:
          type:
            - integer
            - 'null'
          format: int64
          description: >-
            ID of the alarm raised for this VM. Null for a VM listed only because
            its rule has an empty Host Group
        deleted:
          type: boolean
          description: True when the VM has since been deleted
