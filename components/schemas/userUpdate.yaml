type: object
description: Payload for updating an existing user. All fields optional except as required by business rules when changing password or roles.
properties:
  firstName:
    type:
      - 'null'
      - string
    description: First Name
  lastName:
    type:
      - 'null'
      - string
    description: Last Name
  username:
    type: string
    description: Username (unique per tenant).
  email:
    type: string
    description: Email address
  password:
    type: string
    format: password
    description: New password (omit to leave unchanged)
  passwordConfirmation:
    type: string
    format: password
    description: >
      Optional. If omitted when `password` is set, the API auto-confirms.
      If provided (including empty string), it is validated against `password`.
  roles:
    type: array
    description: >
      Roles to assign. Accepts role id integers and/or ReferenceObjects with `id`.
      Singular `role` is also accepted.
    items:
      oneOf:
        - type: integer
          format: int64
        - $ref: ./ReferenceObject.yaml
  role:
    description: Singular role alias accepted in addition to `roles`
    oneOf:
      - type: integer
        format: int64
      - $ref: ./ReferenceObject.yaml
      - type: array
        items:
          oneOf:
            - type: integer
              format: int64
            - $ref: ./ReferenceObject.yaml
  receiveNotifications:
    type: boolean
    description: Receive Notifications?
  enabled:
    type: boolean
    description: Whether the user account is enabled
  accountLocked:
    type: boolean
    description: Whether the user account is locked
  passwordExpired:
    type: boolean
    description: Force password change on next login
  linuxUsername:
    type:
      - 'null'
      - string
  linuxPassword:
    type:
      - 'null'
      - string
    format: password
    description: Set or clear linux password. Masked values (`********`) are ignored.
  linuxPasswordConfirmation:
    type:
      - 'null'
      - string
    format: password
  linuxKeyPairId:
    description: Linux SSH Key id (integer), empty string, or null
    oneOf:
      - type: integer
        format: int64
      - type: string
      - type: 'null'
  windowsUsername:
    type:
      - 'null'
      - string
  windowsPassword:
    type:
      - 'null'
      - string
    format: password
    description: Set or clear windows password. Masked values (`********`) are ignored.
  windowsPasswordConfirmation:
    type:
      - 'null'
      - string
    format: password
  defaultPersona:
    description: Default persona as id, code string, object `{id}`/`{code}`, or null to clear
    oneOf:
      - type: 'null'
      - type: integer
        format: int64
      - type: string
      - type: object
        properties:
          id:
            type: integer
            format: int64
          code:
            type: string
  defaultPersonaId:
    type:
      - integer
      - 'null'
    format: int64
    description: Alias for default persona id
