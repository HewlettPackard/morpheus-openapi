type: object
properties:
  id:
    type: integer
    format: int64
  code:
    type: string
  name:
    type: string
  displayOrder:
    type: integer
    format: int64
  defaultType:
    type: boolean
  customLabel:
    type: boolean
  customSize:
    type: boolean
  customSizeOptions:
    type:
      - string
      - 'null'
  multiAttachSupported:
    type:
      - boolean
      - 'null'
    description: Whether volumes of this type can be attached to more than one server at a time.
  optionTypes:
    type:
      - array
      - 'null'
    description: Configuration fields offered by this volume type for standalone storage server volumes.
    items:
      $ref: optionType.yaml
  provisionOptionTypes:
    type:
      - array
      - 'null'
    description: |-
      Custom per-volume configuration fields offered by this volume type during instance and server
      provisioning and reconfigure, combined with the provision type's `storageVolumeOptionTypes`.
    items:
      $ref: optionType.yaml
