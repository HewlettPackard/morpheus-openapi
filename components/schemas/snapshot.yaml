type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  description:
    type:
      - string
      - 'null'
  externalId:
    type:
      - string
      - 'null'
  status:
    type: string
  state:
    type:
      - string
      - 'null'
  snapshotType:
    type: string
  snapshotCreated:
    type:
      - string
      - 'null'
    format: date-time
  maxStorage:
    type:
      - integer
      - 'null'
    format: int64
    description: Total size of the snapshot in bytes. Null when not populated.
  zone:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  datastore:
    type:
      - string
      - 'null'
  parentSnapshot:
    type:
      - string
      - 'null'
  snapshotFiles:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
        externalId:
          type: string
        path:
          type: string
        exportPath:
          type: string
        volume:
          type:
            - object
            - 'null'
          properties:
            id:
              type: integer
              format: int64
        diskIndex:
          type: integer
        fileSize:
          type:
            - integer
            - 'null'
          format: int64
          description: Size of the snapshot file in bytes. Null when not populated.
  currentlyActive:
    type: boolean
  memorySnapshot: 
    type: boolean
  forExport: 
    type: boolean
  forBackup: 
    type: boolean
  dateCreated:
    type: string
    format: date-time
