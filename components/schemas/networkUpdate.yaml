type: object
properties:
  name:
    type: string
    description: Name. Applied when the network type's `nameEditable` flag is set; otherwise ignored.
  displayName:
    type: string
    description: Display Name
  labels:
    type:
      - array
      - 'null'
    description: Array of label strings, can be used for filtering.
    items:
      type: string
  description:
    type:
      - string
      - 'null'
    description: Description
  ipv4Enabled:
    type: boolean
  ipv6Enabled:
    type: boolean
  cidr:
    type: string
    description: CIDR Network. Applied when the network type's `cidrEditable` flag is set; otherwise ignored.
  gateway:
    type: string
    description: Network Gateway. Applied when the network type's `gatewayEditable` flag is set; otherwise ignored.
  dnsPrimary:
    type: string
    description: Primary DNS Server. Applied when the network type's `dnsEditable` flag is set; otherwise ignored.
  dnsSecondary:
    type: string
    description: Secondary DNS Server. Applied when the network type's `dnsEditable` flag is set; otherwise ignored.
  gatewayIPv6:
    type:
      - string
      - 'null'
    description: IPv6 Network Gateway
  netmaskIPv6:
    type:
      - string
      - 'null'
  dnsPrimaryIPv6:
    type:
      - string
      - 'null'
    description: Primary IPv6 DNS Server
  dnsSecondaryIPv6:
    type:
      - string
      - 'null'
    description: Secondary IPv6 DNS Server
  cidrIPv6:
    type: string
    description: IPv6 Network CIDR
  vlanId:
    type:
      - integer
      - 'null'
    format: int64
    description: VLAN ID; null removes it. Applied when the network type's `vlanIdEditable` flag is set; otherwise ignored.
  switchId:
    type: string
    description: Network switch identifier
    example: "Compute"
  networkServer:
    type: object
    description: Network server (integration) the network belongs to; see the create request. Not returned by the API.
    properties:
      id:
        type: integer
        format: int64
        description: Network Server ID
  parentNetwork:
    type: object
    description: Parent network of a custom child network (type `childNetwork`). Not returned by the API.
    properties:
      id:
        type: integer
        format: int64
        description: Parent Network ID
  pool:
    type:
      - integer
      - 'null'
    format: int64
    description: Network Pool ID
  poolIPv6:
    type:
      - integer
      - 'null'
    format: int64
    description: IPv6 Network Pool ID
  zonePool:
    type:
      - object
      - 'null'
    description: Zone pool (resource pool) the network is assigned to; null, or a null id, removes the assignment
    properties:
      id:
        type:
          - integer
          - 'null'
        format: int64
        description: Morpheus zone pool ID of the GCP Project for the network; null removes the assignment
  allowStaticOverride:
    type: boolean
    description: Allow IP Override
  assignPublicIp:
    type: boolean
    description: Assign Public IP
  active:
    type: boolean
    description: Activate (true) or disable (false) the network
  dhcpServer:
    type: boolean
    description: DHCP Server enabled network. Applied when the network type's `dhcpServerEditable` flag is set; otherwise ignored.
  dhcpServerIPv6:
    type: boolean
    description: IPv6 DHCP Server enabled network
  networkDomain:
    type:
      - object
      - 'null'
    description: Network domain; null, or a null id, removes it
    properties:
      id:
        type:
          - integer
          - 'null'
        format: int64
        description: Network Domain ID; null removes the domain
  searchDomains:
    type: string
    description: Search Domains
  networkProxy:
    type:
      - object
      - 'null'
    description: Network proxy; null, or a null id, removes it
    properties:
      id:
        type:
          - integer
          - 'null'
        format: int64
        description: Network Proxy ID; null removes the proxy
  applianceUrlProxyBypass:
    type: boolean
    description: Bypass Proxy for Appliance URL
  noProxy:
    type:
      - string
      - 'null'
    description: Comma-separated list of ip addresses or name servers to exclude proxy traversal for. Typically locally routable servers are excluded.
  visibility:
    type: string
    description: Visibility, private or public.
    default: private
    enum:
      - private
      - public
  config:
    type: object
    description: Configuration object. Settings vary by type.
  tenants:
    type: array
    description: Array of tenant account ids that are allowed access
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
  resourcePermissions:
    type: object
    properties:
      all:
        type: boolean
        description: Pass true to allow access all groups
      sites:
        type: array
        description: Array of groups that are allowed access
        items:
          type: object
          properties:
            id:
              type: integer
              format: int64
            default:
              type: boolean
