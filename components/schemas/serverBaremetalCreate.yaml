type: object
description: >
  Generic "Add Host" request body. Despite the operationId, this endpoint adds
  any host type returned by `GET /api/server-types?creatable=true` — a managed
  compute server such as a Kubernetes node, an ESXi/Fusion/Hyper-V metal host, a
  KVM hypervisor, or a bare-metal plugin node (HPE iLO, Omega stub). The fields
  read differ per `server.computeServerType`; the `config` object carries the
  type-specific option-type values.
properties:
  server:
    type: object
    properties:
      cloud:
        type: object
        description: The cloud to add the host to.
        properties:
          id:
            type: integer
            format: int64
            example: 34
      group:
        type: object
        description: The group to add the host to.
        properties:
          id:
            type: integer
            format: int64
            example: 2
      computeServerType:
        type: object
        description: >
          The type of host to add. Supply either `code` or `id` from
          `GET /api/server-types?creatable=true`.
        anyOf:
          - type: object
            properties:
              code:
                type: string
                description: The ComputeServerType's code
                example: "IloBareMetalUnmanaged"
          - type: object
            properties:
              id:
                type: integer
                format: int64
                description: The ComputeServerType's id
                example: 1
      plan:
        type: object
        description: The service plan to size the host. See `GET /api/service-plans`.
        properties:
          id:
            type: integer
            format: int64
            example: 1
      name:
        type: string
        example: example
      description:
        type: string
        example: ""
      labels:
        type: array
        items:
          type: string
        example: []
      visibility:
        type: string
        enum:
          - private
          - public
        example: private
      sshUsername:
        type: string
        description: SSH username for the host.
        example: myuser
      sshPassword:
        type: string
        description: SSH password for the host.
        example: mypassword
      config:
        description: >
          Type-specific configuration object. The documented variants are the
          HPE iLO bare-metal keys and the Omega stub keys; any other creatable
          type's option-type values are accepted via the generic variant.
        anyOf:
          - $ref: serverBaremetalCreateConfigBmaas.yaml
          - $ref: serverBaremetalCreateConfigOmegaBmaas.yaml
          - $ref: serverBaremetalCreateConfigGeneric.yaml
  volumes:
    type: array
    description: Storage volumes to create for the host.
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Use -1 for a new volume.
          example: -1
        rootVolume:
          type: boolean
          example: true
        name:
          type: string
          example: root
        size:
          type: integer
          format: int64
          example: 30
        storageType:
          type: integer
          format: int64
        datastoreId:
          oneOf:
            - type: integer
              format: int64
            - type: string
  networkInterfaces:
    type: array
    description: Network interfaces to attach to the host.
    items:
      type: object
      properties:
        network:
          type: object
          properties:
            id:
              oneOf:
                - type: integer
                  format: int64
                - type: string
                  example: "network-42"
        ipAddress:
          type: string
          description: Static IP address, when the interface uses a static IP mode.
        ipMode:
          type: string
          description: IP assignment mode, e.g. static or dhcp.
        networkInterfaceTypeId:
          type: integer
          format: int64
