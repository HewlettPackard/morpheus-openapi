type: object
properties:
  id:
    type: integer
    format: int64
  code:
    type: string
  name:
    type: string
  description:
    type:
      - string
      - 'null'
  packageType:
    type: string
  packageVersion:
    type: string
  type:
    type: string
  enabled:
    type: boolean
  account:
    type:
      - integer
      - 'null'
    format: int64
  required:
    type: boolean
    description: >-
      True when this package ID belongs to the layout's required packages and
      is installed during provisioning. Optional packages remain false even
      when they share a packageType with a required package.
  repeatInstall:
    type: boolean
  configurable:
    type: boolean
    description: True when the package has a user customisable config
