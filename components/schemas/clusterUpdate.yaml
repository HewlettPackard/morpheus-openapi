type: object
properties:
  name:
    type: string
    description: Cluster name
  description:
    type: string
    description: Cluster description
  labels:
    type:
      - array
      - 'null'
    description: Array of label strings, can be used for filtering.
    items:
      type: string
  enabled:
    type: boolean
    description: Cluster enabled
  useAgent:
    type: boolean
    description: Use the Agent to relay communications for the Kubernetes API instead of direct.
  serviceUrl:
    type: string
    description: Cluster API Url
  serviceToken:
    type: string
    description: Cluster API token
  refresh:
    type: boolean
    description: Queue cluster refresh
  managed:
    type: boolean
    description: Cluster managed
  autoRecoverPowerState:
    type: boolean
    description: Automatically Power on VMs
  cpuPlacementMode:
    type: string
    description: Cluster CPU placement mode
  integrations:
    type: array
    description: Cluster integrations
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Integration ID. Only certain integration types may be associated to a cluster.
  config:
    type: object
    description: Configuration object with parameters that vary by `type`. Only the specified config properties will be updated, other existing config properties will be left unchanged.
    additionalProperties: true
    properties:
      dynamicPlacementMode:
        type: string
        description: Dynamic Placement
        enum:
          - on
          - off
      migrationConcurrencyLimit:
        type: string
        description: Sets the maximum number of VMs to migrate in parallel per host during maintenance mode.
      migrationConcurrencyAutoMode:
        type: string
        description: When enabled, Morpheus automatically sizes maintenance mode migration concurrency based on available bandwidth and VM count, using Migration Concurrency (if set) as an upper bound. When disabled, Migration Concurrency runs as a fixed number of parallel migrations at all times.
