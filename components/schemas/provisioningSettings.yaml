type: object
properties:
  allowZoneSelection:
    type: boolean
  allowServerSelection:
    type: boolean
  requireEnvironments:
    type: boolean
  showPricing:
    type: boolean
  hideDatastoreStats:
    type: boolean
  crossTenantNamingPolicies:
    type: boolean
  reuseSequence:
    type: boolean
  cloudInitUsername:
    type: string
  cloudInitPassword:
    type: string
  cloudInitKeyPair:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  windowsPassword:
    type:
      - string
      - 'null'
  pxeRootPassword:
    type:
      - string
      - 'null'
  defaultTemplateType:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
      code:
        type: string
  deployStorageProvider:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  showConsoleKeyboardSettings:
    type: boolean
    description: Whether console keyboard settings are shown
  cloudInitPasswordHash:
    type:
      - string
      - 'null'
    description: Hash of the cloud-init password
  windowsPasswordHash:
    type:
      - string
      - 'null'
    description: Hash of the Windows administrator password
  pxeRootPasswordHash:
    type:
      - string
      - 'null'
    description: Hash of the PXE root password
  enableCatalog:
    type: boolean
    description: Whether catalog provisioning is enabled
  enableApps:
    type: boolean
    description: Whether apps provisioning is enabled
  enableInstances:
    type: boolean
    description: Whether instances provisioning is enabled
  provisioningOrder:
    type:
      - string
      - 'null'
    description: Provisioning navigation order (dash-separated)
  terraformMode:
    type:
      - string
      - 'null'
    description: Terraform execution mode
  terraformVersion:
    type:
      - string
      - 'null'
    description: Terraform version
