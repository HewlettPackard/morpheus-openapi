type: object
properties:
  enabled:
    type: boolean
  retentionDays:
    type: string
  minimumLogLevel:
    type:
      - string
      - 'null'
    enum:
      - null
      - DEBUG
      - INFO
      - WARN
      - ERROR
  syslogRules:
    type:
      - array
      - 'null'
    items:
      type: object
    example:
      - name: foo
        rule: "*.* @@localhost:4567"