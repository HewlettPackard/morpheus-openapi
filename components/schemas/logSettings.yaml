type: object
properties:
  enabled:
    type: boolean
  retentionDays:
    description: Log retention period in days
    oneOf:
      - type: string
      - type: integer
  minimumLogLevel:
    type:
      - string
      - 'null'
    enum:
      - null
      - DEBUG
      - INFO
      - WARN
      - ERROR
  syslogRules:
    type:
      - array
      - 'null'
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Syslog rule ID
        name:
          type: string
          description: Syslog rule name
        rule:
          type: string
          description: Syslog rule configuration
  integrations:
    type: array
    description: Log forwarding integrations (product-dependent; may be empty)
    items:
      type: object
      properties:
        name:
          type: string
          description: Integration type name
        enabled:
          type: boolean
        host:
          type:
            - string
            - 'null'
        port:
          type:
            - string
            - 'null'
            - integer
