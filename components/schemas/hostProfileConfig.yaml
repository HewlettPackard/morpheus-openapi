type: object
description: Host profile configuration document
properties:
  storage:
    type: object
    properties:
      multipath:
        type: object
        properties:
          enabled: { type: boolean }
          findMultipaths: { type: boolean, description: "Enables automatic multipath detection in /etc/multipath.conf." }
          userFriendlyNames: { type: boolean, description: "Uses /dev/mapper/mpathX aliases instead of raw WWIDs." }
      iscsi:
        type: object
        properties:
          transport: { type: string, enum: [tcp, iser], example: tcp }
          chapEnabled: { type: boolean }
  system:
    type: object
    properties:
      ntp:
        type: object
        properties:
          enabled: { type: boolean }
          servers: { type: array, items: { type: string }, description: "Set of NTP servers for host time synchronization.", example: ["ntp.ubuntu.com"] }
      timezone: { type: string, example: "America/Denver" }
      locale: { type: string, example: "C.UTF-8" }
      syslog:
        type: object
        properties:
          enabled: { type: boolean }
          server: { type: string }
          port: { type: integer }
          protocol: { type: string, enum: [tcp, udp] }
      logging:
        type: object
        properties:
          level: { type: string, enum: [debug, info, warn, error], example: info }
      cpu:
        type: object
        properties:
          powerManagement: { type: string, enum: [performance, powersave, schedutil, userspace, ondemand, conservative], description: "CPU frequency scaling governor. Use performance for hypervisors to prevent VM CPU throttling.", example: performance }
          hyperThreading: { type: boolean, description: "Enable simultaneous multi-threading (SMT/HT) on host CPUs." }
      memory:
        type: object
        properties:
          hugePages:
            type: object
            properties:
              enabled: { type: boolean }
              size: { type: string, enum: ['2M', '1G'], description: "Huge page size: 2M (standard) or 1G (large). Requires host reboot to change.", example: "2M" }
      security:
        type: object
        properties:
          selinux: { type: string, enum: [enforcing, permissive, disabled], description: "SELinux enforcement mode. Ubuntu uses AppArmor instead; set to disabled for Ubuntu-based HVM nodes." }
          fips: { type: boolean, description: "Enables FIPS 140-2 cryptographic compliance. Requires reboot and is not reversible without reinstall." }
  baseline:
    type: object
    description: "Specify package versions to enforce on all hosts in the assigned cluster. Values are pre-filled by Capture from Host."
    properties:
      kernelVersion: { type: string, example: "6.8.0-117-generic" }
      additionalPackages: { type: string, description: "Additional packages to install, one per line in package=version format.", example: "openvswitch=2.17.0" }
      packageVersions:
        type: object
        properties:
          corosync: { type: string, example: "3.1.7" }
          libvirt: { type: string, example: "10.0.0" }
          qemu: { type: string, example: "8.2.2" }
