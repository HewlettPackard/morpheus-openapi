type: object
properties: 
  license: 
    type: object
    description: Current License settings and limits which are the result of stacking all the installed licenses
    properties:
      $ref: licenseProperties.yaml
  installedLicenses:
    type: array
    description: List of all the installed licenses
    items: 
      type: object
      properties:
        $ref: licenseProperties.yaml
  currentUsage: 
    type: object
    properties: 
      memory:
        type: integer
        format: int64
        description: Total Used Memory (bytes)
      storage:
        type: integer
        format: int64
        description: Total Used Storage (bytes)
      workloads:
        type: integer
        format: int64
        description: Total Workloads
      managedServers:
        type: integer
        format: int64
        description: Total Managed Servers
      discoveredServers:
        type: integer
        format: int64
        description: Total Discovered Servers
      hosts:
        type: integer
        format: int64
        description: Total Hosts
      mvm:
        type: integer
        format: int64
        description: Total HPE VM Hosts
      mvmSockets:
        type: integer
        format: int64
        description: Total HPE VM Sockets
      sockets:
        type: integer
        format: int64
        description: Total Sockets
      hypervisorSocketCount:
        type: integer
        format: int64
        description: Hypervisor Socket Count
      publicVirtualMachineCount:
        type: integer
        format: int64
        description: Public Virtual Machine Count
      publicVirtualMachineSocketCount:
        type: integer
        format: int64
        description: Public Virtual Machine Socket Count
      iac:
        type: integer
        format: int64
        description: Total IAC Deployments
      xaas:
        type: integer
        format: int64
        description: Total Xaas Instances
      executions:
        type: integer
        format: int64
        description: Total Executions
      distributedWorkers:
        type: integer
        format: int64
        description: Total Distributed Workers
      discoveredObjects:
        type: integer
        format: int64
        description: Total Discovered Objects
  licenseLimits:
    type: array
    description: Per-metric limits with current usage
    items:
      type: object
      properties:
        code:
          type: string
        max:
          type:
            - integer
            - number
            - 'null'
        used:
          type:
            - integer
            - number
        percentUsed:
          type: number
        warning:
          type: boolean
        limitReached:
          type: boolean
        unit:
          type: string
  limitReached:
    type: boolean
    description: True when any license limit has been reached
