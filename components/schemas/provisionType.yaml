type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  description:
    type:
      - string
      - 'null'
  code:
    type: string
  aclEnabled:
    type: boolean
  multiTenant:
    type: boolean
  managed:
    type: boolean
  hostNetwork:
    type: boolean
  customSupported:
    type: boolean
  mapPorts:
    type: boolean
  exportServer:
    type: boolean
  viewSet:
    type:
      - string
      - 'null'
  serverType:
    type: string
  hostType:
    type: string
  addVolumes:
    type: boolean
  hasVolumes:
    type: boolean
  hasDatastore:
    type: boolean
  hasNetworks:
    type: boolean
  maxNetworks:
    type: integer
    format: int64
  customizeVolume:
    type: boolean
  rootDiskCustomizable:
    type: boolean
  rootDiskSizeKnown:
    type: boolean
  rootDiskResizable:
    type: boolean
  lvmSupported:
    type: boolean
  hostDiskMode:
    type: string
  minDisk:
    type: integer
    format: int64
  maxDisk:
    type:
      - string
      - 'null'
  resizeCopiesVolumes:
    type: boolean
  canChangeDatastoreOnResize:
    type:
      - boolean
      - 'null'
    description: Whether an existing volume's datastore can be changed during instance or server reconfigure.
  canChangeDiskController:
    type:
      - boolean
      - 'null'
    description: Whether an existing volume's storage controller mount point can be changed during instance or server reconfigure.
  supportsAutoDatastore:
    type: boolean
  hasStorageControllers:
    type:
      - boolean
      - 'null'
    description: Whether this provision type supports storage controllers.
  hasZonePools:
    type: boolean
  hasSecurityGroups:
    type: boolean
  hasParameters:
    type: boolean
  canEnforceTags:
    type:
      - boolean
      - 'null'
  disableRootDatastore:
    type: boolean
  hasSnapshots:
    type: boolean
  hasMemorySnapshots:
    type: boolean
  hasSpecTemplates:
    type: boolean
  hasPreview:
    type: boolean
  zonePoolRequired:
    type: boolean
  planRequiresPool:
    type: boolean
  hasFolders:
    type:
      - boolean
      - 'null'
  supportsNetworkConnected:
    type:
      - boolean
      - 'null'
    description: Whether network interfaces on this provision type support the `connected` state flag.
  supportsPersistentReservations:
    type:
      - boolean
      - 'null'
    description: Whether this provision type supports SCSI-3 persistent reservations on storage volumes.
  optionTypes:
    type:
      - array
      - 'null'
    items:
      $ref: optionType.yaml
  storageVolumeOptionTypes:
    type:
      - array
      - 'null'
    description: |-
      Custom per-volume configuration fields offered by this provision type. These are combined with the
      `provisionOptionTypes` of the selected `storageTypes` entry to form the full set of config fields for a
      single storage volume, and their values are supplied per volume via the `config` object on instance
      create and resize payloads.

      Definitions are de-duplicated by option type identity. A provision type and a storage volume type must
      not contribute two different definitions that share a `code` or whose `fieldName`/`fieldSetName`/
      `fieldGetName` config paths overlap — such a collision is reported rather than silently resolved.
    items:
      $ref: optionType.yaml
  customOptionTypes:
    type:
      - array
      - 'null'
    items:
      $ref: optionType.yaml
  networkTypes:
    type:
      - array
      - 'null'
    items:
      $ref: networkType.yaml
  storageTypes:
    type:
      - array
      - 'null'
    items:
      $ref: storageType.yaml
  rootStorageTypes:
    type:
      - array
      - 'null'
    items:
      $ref: storageType.yaml
  controllerTypes:
    type:
      - array
      - 'null'
    items:
      $ref: controllerType.yaml
  storageProfiles:
    type:
      - array
      - 'null'
    items:
      $ref: storageProfile.yaml