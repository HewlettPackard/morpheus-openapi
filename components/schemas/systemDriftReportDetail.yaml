allOf:
  - $ref: systemDriftReport.yaml
  - type: object
    properties:
      ruleResults:
        type: array
        description: |
          Per-rule results, including partial results from failed checks when available.
          Empty when no rule payload is available, including terminal reports without rules.
        items:
          type: object
          properties:
            id:
              type:
                - string
                - 'null'
            ruleName:
              type:
                - string
                - 'null'
            ruleDescription:
              type:
                - string
                - 'null'
            ruleType:
              type:
                - string
                - 'null'
            status:
              type:
                - string
                - 'null'
              enum:
                - PASSED
                - FAILED
                - SKIPPED
                - WARNING
                - null
            resultDescription:
              type:
                - string
                - 'null'
            affectedObjects:
              type: array
              items:
                type: string
            recommendation:
              type:
                - string
                - 'null'
