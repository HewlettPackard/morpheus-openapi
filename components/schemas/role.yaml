type: object
properties:
  role:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        description: a unique name of the role
      authority:
        type: string
        description: Alias for name
      description:
        type:
          - string
          - 'null'
      landingUrl:
        type:
          - string
          - 'null'
        description: An optional override for the default landing page after login for a user.
      scope:
        type: string
      roleType:
        type: string
      multitenant:
        type: boolean
      multitenantLocked:
        type: boolean
      parentRoleId:
        type:
          - string
          - 'null'
      diverged:
        type: boolean
      tenantCopies:
        type: array
        description: >-
          The per-tenant copies of a multitenant master role, each identifying a
          subtenant and the id of the role copy propagated into it. Populated
          only for multitenant=true master roles on Morpheus 9.0.2 and later;
          empty or absent otherwise.
        items:
          type: object
          properties:
            tenantId:
              type: integer
              format: int64
              description: The id of the subtenant (account) the copy belongs to.
            roleId:
              type: integer
              format: int64
              description: The id of the propagated per-tenant role copy.
            diverged:
              type: boolean
              description: >-
                Whether the subtenant has modified (diverged) its copy, which
                stops further propagation of changes from the master role.
      ownerId:
        type: integer
        format: int64
      owner:
        type: object
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
      defaultPersona:
        type:
          - object
          - 'null'
        properties:
          id:
            type: integer
            format: int64
          code:
            type: string
          name:
            type: string
      dateCreated:
        type: string
        format: date-time
      lastUpdated:
        type: string
        format: date-time
  featurePermissions:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        access:
          type: string
        subCategory:
          type: string
  globalSiteAccess:
    type: string
  sites:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        access:
          type: string
  globalZoneAccess:
    type: string
  zones:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        access:
          type: string
