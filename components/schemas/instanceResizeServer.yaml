type: object
description: |
  A per-node resize payload targeting one container (and its backing server) within a
  multi-node instance. Each entry carries the same fields as a flat resize request, so
  nodes that have drifted apart can be given different plans, volumes, controllers and
  network interfaces in a single call.
required:
  - containerId
properties:
  containerId:
    type: integer
    format: int64
    example: 42
    description: |
      The id of the container within this instance that the entry applies to. Required.
      Must be a unique positive integer belonging to the instance being resized; otherwise
      the whole request fails with `Container {id} does not belong to this instance`.
  serverId:
    type: integer
    format: int64
    example: 57
    description: |
      Optional id of the compute server backing `containerId`. When supplied it is
      cross-checked against the container's actual server and a mismatch fails the whole
      request, which guards against a stale client applying one node's edits to another.
  servicePlanId:
    type: integer
    format: int64
    example: 75
    description: |
      Service plan to apply to this node. `servicePlan` is accepted as an alias. When
      omitted the node's current service plan is used. Changing the plan or custom plan
      options requires the `provisioning-reconfigure-change-plan` permission.
  servicePlanOptions:
    $ref: servicePlanOptions.yaml
  volumes:
    type: array
    description: |
      Desired volume state for this node, in the same format as the top-level `volumes`
      array. Omit the key to preserve the node's current volumes.

      When a shared volume (matching `sharedVolumeId`) is modified or deleted on one node,
      every other server attached to that shared volume must agree on the same `size`,
      `storageType`, `datastoreId`, `maxIOPS`, `config`, or deletion, or the request fails
      with `Shared disk edits or deletions must agree across all attached servers`.
    items:
      $ref: instanceCreateVolume.yaml
  storageControllers:
    type: array
    description: |
      Desired storage controller state for this node, in the same format as the top-level
      `storageControllers` array.
    items:
      $ref: instanceCreateStorageController.yaml
  storageController:
    type: array
    description: Singular alias for `storageControllers`. Takes precedence when both are supplied.
    items:
      $ref: instanceCreateStorageController.yaml
  networkInterfaces:
    type: array
    description: |
      Desired network interface state for this node, in the same format as the top-level
      `networkInterfaces` array. Omit the key to leave the node's interfaces untouched.
    items:
      $ref: instanceCreateNetwork.yaml
  config:
    type:
      - object
      - 'null'
    additionalProperties: true
    description: |
      Reconfigure option values for this node, merged on top of the node's current
      configuration. Must be an object when supplied.
  deleteOriginalVolumes:
    type: boolean
    description: >-
      Delete the original volumes on this node after resizing when the provision type
      copies volumes (`resizeCopiesVolumes`).
