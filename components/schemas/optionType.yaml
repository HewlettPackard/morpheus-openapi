      - 'null'
  displayValueOnDetails:
    type:
      - boolean
      - 'null'
  showOnCreate:
    type:
      - boolean
      - 'null'
  showOnEdit:
    type:
      - boolean
      - 'null'
  localCredential:
    type:
      - boolean
      - 'null'
