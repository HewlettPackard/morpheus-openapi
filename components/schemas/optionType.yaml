      - string
      - 'null'
  fieldClass:
    type:
      - string
      - 'null'
  fieldAddOn:
    type:
      - string
      - 'null'
  fieldComponent:
    type:
      - string
      - 'null'
  fieldInput:
    type:
      - string
      - 'null'
  placeHolder:
    type:
      - string
      - 'null'
  verifyPattern:
    type:
      - string
      - 'null'
  helpBlock:
    type:
      - string
      - 'null'
  helpBlockFieldCode:
    type:
      - string
      - 'null'
  defaultValue:
    type:
      - string
      - 'null'
  optionSource:
    type:
      - string
      - 'null'
  optionSourceType:
    type:
      - string
      - 'null'
  optionList:
    type:
      - object
      - 'null'
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  type:
    type: string
  advanced:
    type: boolean
  required:
    type: boolean
  exportMeta:
    type: boolean
  editable:
    type: boolean
  secretField:
    type: boolean
    description: |-
      Whether this field holds a secret. Values for secret fields are redacted in API responses that
      echo back stored configuration, so a read-modify-write of the returned value will not round-trip
      the real secret — re-send the actual value to change it, or omit the key to leave it unchanged.
  ignoreField:
    type:
      - boolean
      - 'null'
    description: When true, this option type is excluded from the fields collected for the object it is attached to.
  fieldSetContext:
    type:
      - string
      - 'null'
    description: Context the value is written into when it differs from `fieldContext`. For storage volume option types only `config` is honoured.
  fieldGetContext:
    type:
      - string
      - 'null'
    description: Context the value is read from when it differs from `fieldContext`. For storage volume option types only `config` is honoured.
  fieldSetName:
    type:
      - string
      - 'null'
    description: Config path the value is written to when it differs from `fieldName`. Supports dot notation for nested config.
  fieldGetName:
    type:
      - string
      - 'null'
    description: Config path the value is read from when it differs from `fieldName`. Supports dot notation for nested config.
  creatable:
    type: boolean
  config:
    type:
      - object
      - 'null'
  displayOrder:
    type: integer
    format: int64
  wrapperClass:
    type:
      - string
      - 'null'
  enabled:
    type: boolean
  noBlank:
    type: boolean
  dependsOnCode:
    type:
