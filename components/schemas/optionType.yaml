type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  labels:
    type:
      - array
      - 'null'
    items:
      type: string
  description:
    type:
      - string
      - 'null'
  code:
    type: string
  fieldName:
    type: string
  fieldLabel:
    type: string
  fieldCode:
