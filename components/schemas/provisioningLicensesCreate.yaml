type: object
required: 
  - name
  - licenseType
  - licenseKey
properties: 
  name: 
    type: string
    description: Name
  licenseType:
    description: |
      License type code string, or object with `code` and/or `id`.
    oneOf:
      - type: string
        example: win
      - type: object
        properties:
          id:
            type: integer
            format: int64
          code:
            type: string
            example: win
  licenseKey: 
    type: string
    description: License Key - The license key, to be kept a secret.
  orgName: 
    type: string
    description: Org Name - The Organization Name (if applicable) related to the license key
  fullName: 
    type: string
    description: Full Name - The Full Name (if applicable) related to the license key
  licenseVersion: 
    type: string
    description: License Version
  copies: 
    type: integer
    format: int64
    description: Copies - The number of times the key can be used.
    default: 1
  description: 
    type: string
    description: Description
  virtualImages:
    type: array
    description: |
      Virtual image ids, or objects with `id`.
    items:
      oneOf:
        - type: integer
          format: int64
        - type: object
          properties:
            id:
              type: integer
              format: int64
  tenants: 
    type: array
    description: Tenants - Array of tenants that are allowed to use the key.
    items: 
      type: integer
      format: int64
