type: object
properties:
  roles:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Role display name (same as authority)
        authority:
          type: string
        description:
          type:
            - string
            - 'null'
        roleType:
          type: string
        owner:
          type:
            - object
            - 'null'
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
