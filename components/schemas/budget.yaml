type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
  description:
    type:
      - string
      - 'null'
  account:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  forecastType:
    type:
      - object
      - 'null'
    description: Forecast Model type
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  enabled:
    type: boolean
  refScope:
    type: string
  refType:
    type: string
  refId:
    type: integer
    format: int64
  refName:
    type: string
  period:
    type: string
  year:
    type: string
    description: The budget year, or `custom` for a budget spanning the explicit `startDate`–`endDate` period.
  resourceType:
    type: string
  timezone:
    type: string
  startDate:
    type: string
    format: date-time
  endDate:
    type: string
    format: date-time
  interval:
    type: string
  costs:
    type: array
    description: The budget amount for each interval, in the account's currency (see `currency`); one per month, quarter or year of the period according to `interval`.
    items:
      type: number
      format: double
  isFiscal:
    type: boolean
  averageCost:
    type: number
    format: double
    description: The mean of `costs`, in the account's currency.
  totalCost:
    type: number
    format: double
    description: The sum of `costs`, in the account's currency.
  currency:
    type: string
  rollover:
    type: boolean
  warningLimit:
    type:
      - string
      - 'null'
  overLimit:
    type:
      - string
      - 'null'
  externalId:
    type:
      - string
      - 'null'
  internalId:
    type:
      - string
      - 'null'
  createdById:
    type: integer
    format: int64
  createdByName:
    type: string
  updatedById:
    type:
      - string
      - 'null'
  updatedByName:
    type:
      - string
      - 'null'
  dateCreated:
    type: string
    format: date-time
  lastUpdated:
    type: string
    format: date-time
  stats:
    type: object
    properties:
      currency:
        type: string
      conversionRate:
        type: integer
        format: int64
      intervals:
        type: array
        items:
          type: object
          properties:
            index:
              type: integer
              format: int64
            month:
              type: string
            shortName:
              type: string
            chartName:
              type: string
            budget:
              type: number
              format: double
              description: The budgeted amount for the interval, in the budget's currency.
            cost:
              type: number
              format: double
              description: The amount spent in the interval, in the budget's currency.
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
      current:
        type: object
        properties:
          estimatedCost:
            type:
              - string
              - 'null'
          lastCost:
            type:
              - string
              - 'null'
