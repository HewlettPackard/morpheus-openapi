type: object
properties:
  name:
    type: string
    description: Script name
    maxLength: 255
  labels:
    type:
      - array
      - 'null'
    description: Array of label strings, can be used for filtering.
    items:
      type: string
  category:
    type:
      - string
      - 'null'
    description: Script category; null clears it
  scriptVersion:
    type: string
    description: Version of the script
    default: "1"
  scriptPhase:
    type: string
    description: Phase for the script, provision, start, etc.
    enum:
      - start
      - stop
      - preProvision
      - provision
      - postProvision
      - preDeploy
      - deploy
      - reconfigure
      - scaleDown
      - teardown
  scriptType:
    type: string
    description: Type for the script
    default: bash
    enum:
      - bash
      - powershell
  script:
    type: string
    description: Script content, that is, the code itself.
  runAsUser:
    type:
      - string
      - 'null'
    description: Run as a specific user; null clears it
  sudoUser:
    type: boolean
    description: Sudo, whether or not to run with sudo.
    default: false
