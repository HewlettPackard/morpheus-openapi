type: object
properties:
  name:
    type: string
    description: Name
  affinityType:
    $ref: affinityType.yaml
  active:
    type: boolean
    description: Active
  pool:
    type: object
    properties:
      id:
        type: integer
        format: int64
    description: Resource Pool ID to scope the Affinity Group to
  servers:
    type: array
    items:
      type: integer
      format: int64
    description: >-
      List of Server IDs to include in the Affinity Group. Use this for a legacy
      VM-to-VM rule. Mutually exclusive with `vmGroup`/`hostGroup` — send either
      `servers`, or both `vmGroup` and `hostGroup`, never both shapes at once.
  vmGroup:
    type:
      - object
      - 'null'
    description: >-
      The VM Group side of a combined VM-to-Host rule. Must be sent together
      with `hostGroup`, and `servers` must be empty. Send `null` for both group
      fields to clear a combined rule.
    properties:
      id:
        type: integer
        format: int64
  hostGroup:
    type:
      - object
      - 'null'
    description: >-
      The Host Group side of a combined VM-to-Host rule. Must be sent together
      with `vmGroup`, and `servers` must be empty.
    properties:
      id:
        type: integer
        format: int64
  visibility:
    $ref: visibility.yaml
  tenants:
    type: array
    description: Array of tenant account ids that are allowed access
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
  resourcePermissions:
    type: object
    description: Resource Permissions for controlling Group Access
    properties:
      all:
        type: boolean
      sites:
        type:
          - array
          - 'null'
        items:
          type: object