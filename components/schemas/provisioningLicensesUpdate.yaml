type: object
properties: 
  name: 
    type: string
    description: Name
  licenseVersion: 
    type: string
    description: License Version
  copies: 
    type: integer
    format: int64
    description: Copies - The number of times the key can be used.
    default: 1
  description: 
    type: string
    description: Description
  virtualImages:
    type: array
    description: |
      Virtual image ids, or objects with `id` (UI sends `[{ "id": 1 }]`). Replaces set when provided.
    items:
      oneOf:
        - type: integer
          format: int64
        - type: object
          properties:
            id:
              type: integer
              format: int64
  tenants: 
    type: array
    description: Tenants - Array of tenants that are allowed to use the key.
    items: 
      type: integer
      format: int64
