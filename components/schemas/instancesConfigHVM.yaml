title: HVM Instance Configuration
type: object
properties:
  noAgent:
    type:
      - boolean
      - 'null'
    description: Skipping Agent installation will result in a lack of logging and guest operating system statistics. Automation scripts may also be adversely affected.
    default: false
  resourcePoolId:
    type: string
    description: id of the resource group to be used, can be prefixed with `pool-`. A resource pool group can be specified instead by prefixing its ID with `poolGroup-`.
  nestedVirtualization:
    type: string
    description: Enable Nested Virtualization
    default: "off"
    enum:
      - "on"
      - "off"
  disableQgaChannel:
    type:
      - boolean
      - 'null'
    description: Exclude the virtio-serial channel for the QEMU Guest Agent from the VM. Intended for VMs that do not use a guest agent or need the slot for another device. Takes effect on existing VMs only after a full power-off.
    default: false
  createUser:
    type:
      - boolean
      - 'null'
    description: Create user
    default: false
  poolProviderType:
    type: string
    description: The type of pool provider to use for this instance, must be "mvm"
    default: "mvm"
  kvmHostId:
    type: integer
    format: int64
    description: The ID of the KVM host to provision the instance on
  affinityGroup:
    type: integer
    format: int64
    description: >-
      ID of an affinity group to add this instance's servers to. This records
      membership; it does not by itself influence which host the instance is
      placed on. Placement is applied by the cluster's dynamic placement loop,
      which must be enabled on the cluster. Applies at provision time only.
  affinityGroupId:
    type: integer
    format: int64
    description: >-
      ID of an affinity group to consider during host selection. For a
      KEEP_TOGETHER group the instance is placed on the same host as the group's
      existing members. Has no effect for a KEEP_SEPARATE group, or when the
      group has no members yet. Normally set to the same value as affinityGroup,
      which records the membership itself. Applies at provision time only.
  provisionPoweredOff:
    type: boolean
    description: Whether to provision the instance in a powered off state
    default: false
  bootToBios:
    type:
      - boolean
      - 'null'
    description: Enable or disable the QEMU boot menu at VM startup. When enabled, the VM displays a boot selection menu. Defaults to true for new HVM VMs.
    default: true
  bootToBiosMenuTimeout:
    type:
      - integer
      - 'null'
    description: Boot menu display duration in seconds (0-30). Only applicable when bootToBios is true. A value of 0 means no delay.
    default: 0
    minimum: 0
    maximum: 30