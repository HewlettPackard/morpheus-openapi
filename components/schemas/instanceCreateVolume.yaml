type: object
properties:
  id:
    type: integer
    format: int64
    description: The id for the LV configuration being created.
    example: 1
    default: -1
  rootVolume:
    type: boolean
    description: If set to false then a non-root LV will be created.
    default: true
  name:
    type: string
    description: Name/type of the LV being created.
    example: data
    default: root
  size:
    type: integer
    format: int64
    description: Size of the LV to be created in GBs.  Uses default from service plan.
    example: 5
  sizeId:
    type:
      - integer
      - 'null'
    format: int64
    description: Can be used to select pre-existing LV choices from Morpheus.
  storageType:
    oneOf:
      - type:
          - integer
          - 'null'
        format: int64
      - type: object
        properties:
          id:
            type: integer
            format: int64
            description: The id of the LV type. Not guaranteed to be stable across appliances; prefer `code` when known.
          code:
            type: string
            description: The code of the LV type, eg. `"standard"` or `"io1"`. Takes precedence over `id` when both are provided.
    description: |-
      Identifier for LV type. Can be a plain numeric id (legacy form), or an object with `id` and/or `code`,
      eg. `{"code": "standard"}`. When both `id` and `code` are supplied, `code` takes precedence.
  datastoreId:
    anyOf:
      - type:
          - string
          - 'null'
      - type:
          - integer
          - 'null'
        format: int64
    description: The ID of the specific datastore. Auto selection can be specified as auto or autoCluster (for clusters).
  multiAttachAction:
    type:
      - string
      - 'null'
    enum:
      - standard
      - create
      - attach
      - null
    default: standard
    example: create
    description: |-
      How the volume is shared, for storage types that support multi-attach (`multiAttachSupported`).
      * `standard` - a normal volume for this instance. Same as omitting the field.
      * `create` - create a new shareable volume. When the instance has more than one node or copy, the first creates the volume and the others attach to it.
      * `attach` - attach the existing shared volume given in `multiAttachSourceVolume`. `size`, `storageType`, and `datastoreId` follow the source volume.
  multiAttachSourceVolume:
    type:
      - integer
      - 'null'
    format: int64
    example: 31
    description: The id of the existing shared volume to attach. Required when `multiAttachAction` is `attach`, ignored otherwise.
  persistentReservations:
    type: boolean
    default: false
    description: >-
      Enable SCSI-3 persistent reservations on this volume. Requires a shared block-backed volume on a
      provision type and controller type with `supportsPersistentReservations`.
  volumeSetAction:
    type:
      - string
      - 'null'
    enum:
      - none
      - create
      - add
      - null
    description: |-
      Volume set action for newly provisioned volumes on storage types with `supportsVolumeSet: true`.
      Ignored when attaching an existing shared volume (`multiAttachAction: "attach"`).
      * `none` - do not associate the volume with a volume set.
      * `create` - create a new volume set with the name given in `volumeSetName`.
      * `add` - add the volume to the existing volume set named in `volumeSetName`.
  volumeSetName:
    type:
      - string
      - 'null'
    description: Name of the volume set to create or join when `volumeSetAction` is `create` or `add`.
  virtualImageId:
    anyOf:
      - type:
          - integer
          - 'null'
        format: int64
      - type:
          - string
          - 'null'
    description: |-
      ID of the virtual image (ISO) to mount on a CD-ROM (`iso`) volume. During reconfigure (`resize`),
      passing an empty string `""` or `null` on an existing CD-ROM volume ejects the currently mounted
      ISO media; omitting `virtualImageId` leaves the mounted image unchanged.
  definitionId:
    type:
      - string
      - 'null'
    description: |-
      Optional correlation identifier linking the same logical volume across containers in a multi-node
      instance. Automatically generated for new volumes on multi-node resize when omitted.
  controllerMountPoint:
    type: string
    description: |-
      The controller mount point specification for this volume in the format: `"id:busNumber:typeId:unitNumber"`
      For new storage controllers the id is passed as -1, so an example value would be: `"-1:1:6:0"` which translates to id: -1 (new), busNumber: 1, storage controller type id: 6 (SCSI VMware Paravirtual), unit number: 0.
      For existing controllers (`id > 0`), `busNumber` preserves the controller's recorded string bus identifier.
      The current list of storage controllers is returned for instances and servers for determining existing id values.
      Use `/api/provision-types?code=vmware` to see the available `controllerTypes` for vmware.
  storageProfile:
    type:
      - string
      - 'null'
    format: string
    description: Storage Profile Code for the volume storage profile assignment. eg. `"kvm-cache-none"` or `"kvm-cache-directsync"`. Use `/api/provision-types?code=kvm` to see the available `storageProfiles` for HVM and KVM.
  uuid:
    type: string
    description: Optional UUID. This value is automatically generated by default.
  config:
    type:
      - object
      - 'null'
    additionalProperties: true
    description: |-
      Custom per-volume configuration values. The accepted keys are not fixed - they are defined by option
      types. Combine the `provisionOptionTypes` of the volume's `storageType` with the
      `storageVolumeOptionTypes` of the provision type, and use each option type's `fieldName` as the key.
      Nested keys are supported via dot notation in `fieldName`/`fieldSetName`. Use
      `/api/provision-types?code=<code>` to discover the fields available for a given provision type.

      Behaviour differs between new and existing volumes:

      * **New volumes** (no `id`, or an `id` of `-1`) - omitted fields are populated from each option type's
        `defaultValue`, and required fields are enforced. Option types with `editable` set to `false` are
        creation-only and are accepted on new volumes, including new volumes added during reconfigure.
      * **Existing volumes** (resize) - `config` is only processed when supplied. Omit it to leave the
        volume's current configuration untouched; send it to apply the values it contains. Option types with
        `editable` set to `false` cannot be changed on an already-provisioned volume.

      Values for option types marked `secretField` are redacted when configuration is read back, so echoing a
      previously returned `config` will not round-trip the real secret.

      Validation failures are reported per volume, keyed as `volume[N]`. This includes the case where the
      provision type and the volume type contribute conflicting option definitions - two definitions sharing
      a `code`, or whose config paths overlap.
