type: object
properties:
  id:
    type: integer
    format: int64
  name:
    type: string
    description: Name
  affinityType:
    $ref: affinityType.yaml
  source:
    type: string
    description: Source
  externalId:
    type: string
    description: Identifier of the corresponding rule on the underlying platform
  refType:
    type: string
    description: Reference Type for the Affinity Group. Can be ComputeZone or ComputeServerGroup for cloud or cluster respectively
  refId:
    type: integer
    format: int64
    description: Reference ID for the Affinity Group. The ID of the Cloud or Clusterfor cloud or cluster respectively
  active:
    type: boolean
    description: Active
  pool:
    type: object
    properties:
      id:
        type: integer
        format: int64
    description: Resource Pool ID to scope the Affinity Group to
  servers:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string 
    description: >-
      List of Servers in the Affinity Group. Populated only for a legacy
      VM-to-VM rule; always empty for a combined VM-to-Host rule.
  owner:
    type: object
    description: Owning tenant account
    properties:
      id:
        type: integer
        format: int64
  vmGroup:
    type:
      - object
      - 'null'
    description: >-
      The VM Group side of a combined VM-to-Host rule. Null for a legacy
      VM-to-VM rule. When present, `hostGroup` is also present and `servers` is
      empty.
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  hostGroup:
    type:
      - object
      - 'null'
    description: >-
      The Host Group side of a combined VM-to-Host rule. Null for a legacy
      VM-to-VM rule. When present, `vmGroup` is also present and `servers` is
      empty.
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
  visibility:
    type: string
  tenants:
    type: array
    description: Array of tenant account ids that are allowed access
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
  resourcePermissions:
    type: object
    description: Resource Permissions for controlling Group Access
    properties:
      all:
        type: boolean
      sites:
        type:
          - array
          - 'null'
        items:
          type: object
          properties:
            id:
              type: integer
              format: int64
              description: Group ID
            default:
              type: boolean
              description: Whether this is the default group