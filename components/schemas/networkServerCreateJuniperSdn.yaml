title: HPE Morpheus SDN Network Server
type: object
description: |
  The SDN controller integration registered by the HPE Morpheus SDN network plugin for HPE VM
  Essentials (a Juniper CN2 controller). The controller is reached from the HVM cluster's hosts,
  so no service credentials are taken: the plugin stores the CN2 API version in `serviceUrl`
  after the first connection.
required:
  - type
  - name
  - config
properties:
  type:
    type: string
    description: Type Code (morpheus-junipersdn-network)
    enum:
      - morpheus-junipersdn-network
  name:
    type: string
    description: Name
  visibility:
    type: string
    description: "Visibility - Set to public to allow all tenants"
    default: private
    enum:
      - public
      - private
  zoneId:
    type: integer
    format: int64
    description: ID of the HVM Cloud that the SDN network server integration should be attached to.
  config:
    type: object
    description: The plugin's option type values.
    required:
      - controllerAddress
    properties:
      controllerAddress:
        type: string
        description: Address of the CN2 controller. Cannot be changed after the network server is created.
        example: 10.0.0.10
      showIntrospect:
        type: boolean
        description: Show the controller's introspect pages in the Morpheus UI.
        default: false
      enableSubTenants:
        type: boolean
        description: Allow sub-tenants to use the SDN controller.
        default: false
  tenants:
    type: array
    description: Array of tenant account ids that are allowed access
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
