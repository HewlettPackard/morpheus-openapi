description: Configuration for HVM cluster servers
type: object
properties:
  cpuArch:
    type: string
  cpuModel:
    type: string
  dynamicPlacementMode:
    description: When enabled, Dynamic Placement will automatically balance VMs across cluster hosts based on resource utilization. When disabled, VMs will only migrate to a new host if they are pinned to a specific host or failed over and not running on the preferred host.
    type: string
    enum:
      - on
      - off
  powerPolicy:
    type: string
    enum:
    - balanced
    - performance
  vcpuPlacementMode:
    type: string
    enum:
    - unmanaged
    - auto
  storageInterfaceName:
    type: string
  computeInterfaceName:
    type: string
  computeVlans:
    type: string
  overlayInterfaceName:
    type: string
    description: >-
      Name of the host network interface used for the overlay (VXLAN) Open vSwitch bridge, for example
      `ens193`. Optional: Morpheus creates the overlay bridge only when it is set, and recommends setting
      it whenever overlay networks will be used. Applies to HVM 1.x cluster layouts; HVM 2.0 (virtual
      switch) layouts do not use it. Note that on Morpheus 9.0.x with an HVM 1.x layout, omitting it makes
      every host fail to build at the "HVM Host Build OVS Interface" step (`build-ovs.py` exits with
      `KeyError: None`), so set it until the appliance fix is available.
  createUser:
    type: boolean
  migrationConcurrencyLimit:
    type: string
    description: Sets the maximum number of VMs to migrate in parallel per host during maintenance mode.
  migrationConcurrencyAutoMode:
    type: string
    description: When enabled, Morpheus automatically sizes maintenance mode migration concurrency based on available bandwidth and VM count, using Migration Concurrency (if set) as an upper bound. When disabled, Migration Concurrency runs as a fixed number of parallel migrations at all times.
  virtSwitchName:
    description: Name of the HVM virtual switch. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  dns1:
    description: Primary DNS server for the HVM cluster. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  dns2:
    description: Secondary DNS server for the HVM cluster. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  dns3:
    description: Tertiary DNS server for the HVM cluster. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  searchDomain:
    description: DNS search domain for the HVM cluster. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  ntp1:
    description: Primary NTP server for the HVM cluster. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  ntp2:
    description: Secondary NTP server for the HVM cluster. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  proxy:
    description: Proxy server for the HVM cluster. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
  noProxy:
    description: Comma-separated list of hosts that bypass the proxy. Requires a cluster layout with clusterVersion 2.0 or greater.
    type: string
