description: Configuration for HVM cluster servers
type: object
properties:
  cpuArch:
    type: string
  cpuModel:
    type: string
  dynamicPlacementMode:
    type: string
    enum:
      - on
      - off
  powerPolicy:
    type: string
  storageInterfaceName:
    type: string
  computeInterfaceName:
    type: string
  computeVlans:
    type: string
  overlayInterfaceName:
    type: string
  createUser:
    type: boolean
  migrationConcurrencyLimit:
    type: string
    description: Sets the maximum number of VMs to migrate in parallel per host during maintenance mode.
  migrationConcurrencyAutoMode:
    type: string
    description: When enabled, Morpheus automatically sizes maintenance mode migration concurrency based on available bandwidth and VM count, using Migration Concurrency (if set) as an upper bound. When disabled, Migration Concurrency runs as a fixed number of parallel migrations at all times.
