type: object
required:
  - name
properties:
  name:
    type: string
  description:
    type:
      - string
      - 'null'
  sudoUser:
    type: boolean
  serverGroup:
    type:
      - string
      - 'null'
  users:
    type: array
    description: |
      Users in the group. The Administration Users UI sends objects with `id`
      (string option values). Bare integer, string, or `{ id }` entries are accepted.
    items:
      oneOf:
        - type: integer
          format: int64
        - type: string
        - type: object
          properties:
            id:
              oneOf:
                - type: integer
                  format: int64
                - type: string
    example:
      - id: "100"
      - id: "101"
