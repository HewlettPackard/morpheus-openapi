type: object
required:
  - access
properties:
  catalogItemTypeId:
    type: integer
    description: "`id` of the catalog item type"
  name:
    type: string
    description: Catalog item type name (alternative to id). Alias of `catalogItemTypeName`.
  catalogItemTypeName:
    type: string
    description: Alias for `name`
  access:
    type: string
    description: The new access level.
    enum:
      $ref: rolePermissionAccessLevelsForResource.yaml
