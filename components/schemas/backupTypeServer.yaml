title: Backup Server (Host)
required:
  - locationType
  - name
  - serverId
  - backupType
  - jobAction
properties:
  locationType: 
    type: string
    enum:
    - server
  name: 
    type: string
    description: A name for the backup
  serverId:
    type: integer
    format: int64
    description: The ID of the server to backup
  backupType:
    type: string
    description: The backup type code for server backups
    enum:
      - fileBackup
      - directoryBackup
  targetPath:
    type: string
    description: The file or directory path on the target host to back up.
  sshUsername:
    type: string
    description: SSH username for connecting to the server.
  sshPassword:
    type: string
    description: SSH password for connecting to the server.
  target:
    type: integer
    format: int64
    description: The ID of the storage bucket to store the backup in.
  jobAction:
    type: string
    description: Create a new backup job, clone an existing job or add the new backup to an existing job. If not specified, defaults to `new`.
    enum:
      - new
      - clone
      - addTo
  jobId:
    type: integer
    format: int64
    description: The ID of the job to clone or add to. Only applies to jobAction `clone` and `addTo`.
  jobName:
    type: string
    description: Name for new job. Only applies to jobAction `new` and `clone`. Defaults to the backup name if not specified.
  jobSchedule:
    type: integer
    format: int64
    description: The ID of the execute schedule for new job. See Execute Schedules. Only applies to jobAction `new` and `clone`.
  retentionCount:
    type: integer
    format: int64
    description: Retention Count for new job. By default the backup settings value will be used. Only applies to jobAction `new` and `clone`.