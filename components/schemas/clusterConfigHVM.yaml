description: HVM cluster configuration exposed on read. Fields are populated for cluster layouts with clusterVersion 2.0 or greater.
type: object
properties:
  virtSwitchName:
    description: Name of the HVM virtual switch.
    type: string
  dns1:
    description: Primary DNS server for the HVM cluster.
    type: string
  dns2:
    description: Secondary DNS server for the HVM cluster.
    type: string
  dns3:
    description: Tertiary DNS server for the HVM cluster.
    type: string
  searchDomain:
    description: DNS search domain for the HVM cluster.
    type: string
  ntp1:
    description: Primary NTP server for the HVM cluster.
    type: string
  ntp2:
    description: Secondary NTP server for the HVM cluster.
    type: string
  proxy:
    description: Proxy server for the HVM cluster.
    type: string
  noProxy:
    description: Comma-separated list of hosts that bypass the proxy.
    type: string
