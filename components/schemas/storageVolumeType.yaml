type: object
properties:
  id:
    type: integer
    format: int64
  code:
    type: string
  name:
    type: string
  description:
    type: string
  displayOrder:
    type: integer
    format: int64
  defaultType:
    type: boolean
  customLabel:
    type: boolean
  customSize:
    type: boolean
  multiAttachSupported:
    type:
      - boolean
      - 'null'
    description: Whether volumes of this type can be attached to more than one server at a time.
  customSizeOptions:
    type:
      - string
      - 'null'
  configurableIOPS:
    type: boolean
  hasDatastore:
    type: boolean
  category:
    type: string
  enabled:
    type: boolean
  optionTypes:
    type:
      - array
      - 'null'
    description: |-
      Custom per-volume configuration fields offered by this volume type. These are combined with the
      `storageVolumeOptionTypes` of the provision type to form the full set of config fields for a single
      storage volume, and their values are supplied per volume via the `config` object on instance create
      and resize payloads.
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        code:
          type: string
        fieldName:
          type: string
        fieldLabel:
          type: string
        fieldCode:
          type: string
        fieldContext:
          type: string
        fieldGroup:
          type:
            - string
            - 'null'
        fieldClass:
          type:
            - string
            - 'null'
        fieldAddOn:
          type:
            - string
            - 'null'
        fieldComponent:
          type:
            - string
            - 'null'
        fieldInput:
          type:
            - string
            - 'null'
        placeHolder:
          type:
            - string
            - 'null'
        verifyPattern:
          type:
            - string
            - 'null'
        helpBlock:
          type: string
        helpBlockFieldCode:
          type:
            - string
            - 'null'
        defaultValue:
          type:
            - string
            - 'null'
        optionSource:
          type:
            - string
            - 'null'
        optionSourceType:
          type:
            - string
            - 'null'
        optionList:
          type:
            - string
            - 'null'
        type:
          type: string
        advanced:
          type: boolean
        required:
          type: boolean
        exportMeta:
          type: boolean
        editable:
          type: boolean
        secretField:
          type: boolean
          description: |-
            Whether this field holds a secret. Values for secret fields are redacted in API responses that
            echo back stored configuration, so a read-modify-write of the returned value will not round-trip
            the real secret — re-send the actual value to change it, or omit the key to leave it unchanged.
        ignoreField:
          type:
            - boolean
            - 'null'
          description: When true, this option type is excluded from the fields collected for a storage volume.
        fieldSetContext:
          type:
            - string
            - 'null'
          description: Context the value is written into when it differs from `fieldContext`. Only `config` is honoured for storage volume option types.
        fieldGetContext:
          type:
            - string
            - 'null'
          description: Context the value is read from when it differs from `fieldContext`. Only `config` is honoured for storage volume option types.
        fieldSetName:
          type:
            - string
            - 'null'
          description: Config path the value is written to when it differs from `fieldName`. Supports dot notation for nested config.
        fieldGetName:
          type:
            - string
            - 'null'
          description: Config path the value is read from when it differs from `fieldName`. Supports dot notation for nested config.
        creatable:
          type: boolean
        config:
          type:
            - object
            - 'null'
        displayOrder:
          type: integer
          format: int64
        wrapperClass:
          type:
            - string
            - 'null'
        enabled:
          type: boolean
        noBlank:
          type: boolean
        dependsOnCode:
          type:
            - string
            - 'null'
        visibleOnCode:
          type:
            - string
            - 'null'
        requireOnCode:
          type:
            - string
            - 'null'
        contextualDefault:
          type: boolean
        displayValueOnDetails:
          type:
            - boolean
            - 'null'
        showOnCreate:
          type:
            - boolean
            - 'null'
        showOnEdit:
          type:
            - boolean
            - 'null'
        localCredential:
          type:
            - boolean
            - 'null'
