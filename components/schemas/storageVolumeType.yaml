type: object
properties:
  id:
    type: integer
    format: int64
  code:
    type: string
  name:
    type: string
  description:
    type: string
  displayOrder:
    type: integer
    format: int64
  defaultType:
    type: boolean
  customLabel:
    type: boolean
  customSize:
    type: boolean
  multiAttachSupported:
    type:
      - boolean
      - 'null'
    description: Whether volumes of this type can be attached to more than one server at a time.
  customSizeOptions:
    type:
      - string
      - 'null'
  configurableIOPS:
    type: boolean
  hasDatastore:
    type: boolean
  category:
    type: string
  enabled:
    type: boolean
  optionTypes:
    type:
      - array
      - 'null'
    description: |-
      Configuration fields offered by this volume type for standalone storage server volumes
      (`/api/storage-volumes`). Per-disk configuration on instance and server provisioning or
      reconfigure uses `provisionOptionTypes` instead.
    items:
      $ref: optionType.yaml
  provisionOptionTypes:
    type:
      - array
      - 'null'
    description: |-
      Custom per-volume configuration fields offered by this volume type during instance and server
      provisioning and reconfigure. These are combined with the `storageVolumeOptionTypes` of the
      provision type to form the full set of config fields for a single storage volume, and their
      values are supplied per volume via the `config` object on instance create and resize payloads.
    items:
      $ref: optionType.yaml
