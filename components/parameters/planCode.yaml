name: planCode
in: query
description: >-
  Filter by service plan code. Repeatable — supply the parameter more than once
  to match any of several plans.


  Matching is a case-insensitive SQL `like`, so `%` acts as a wildcard, for
  example `?planCode=vm-%`. This is not a regular expression. To filter by
  plan ID or name use `planId` or `plan`.


  Optional. When omitted, no plan filter is applied.
required: false
schema:
  type: array
  items:
    type: string
style: form
explode: true
example:
  - vm-%
