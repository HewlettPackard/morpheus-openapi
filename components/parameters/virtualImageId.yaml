name: id
in: query
description: >-
  Filter by virtual image ID. Repeatable — supply the parameter more than once
  to fetch several images in one request, for example `?id=170332&id=127280`.


  Optional. When omitted, images are not restricted by ID and all images
  matching the other filters are returned; an absent `id` is not an error.
required: false
schema:
  type: array
  items:
    type: integer
    format: int64
style: form
explode: true
example:
  - 170332
  - 127280
