name: priceType
in: query
description: |
  Restricts query to only load only prices with specified priceType.
  * `fixed` - Everything
  * `compute` - Memory + CPU
  * `memory` - Memory
  * `cores` - Cores
  * `storage` - Storage
  * `datastore` - Datastore
  * `platform` - Platform
  * `software` - Software (response alias for software_or_service)
  * `software_or_service` - Software or service
  * `load_balancer` - Load Balancer
  * `load_balancer_virtual_server` - Load Balancer Virtual Server
schema:
  type: string
  enum:
    - fixed
    - compute
    - memory
    - cores
    - storage
    - datastore
    - platform
    - software
    - software_or_service
    - load_balancer
    - load_balancer_virtual_server
