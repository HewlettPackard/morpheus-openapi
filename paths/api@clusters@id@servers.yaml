post: 
  summary: Add Worker
  description: Add Worker 
  operationId: addClusterWorker
  tags: 
    -  Clusters
  parameters:
    - $ref: ../components/parameters/clusterId-path.yaml
  requestBody: 
    content: 
      application/json: 
        schema: 
          type: object
          properties: 
            server:
              $ref: ../components/schemas/clusterServerCreate.yaml
        examples:
          Cluster Request:
            value:
              $ref: ../components/examples/clusterServerCreate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  servers:
                    type: array
                    description: |-
                      Always empty. The host is created asynchronously after this call returns;
                      it appears in the cluster's `servers` (`GET /api/clusters/{clusterId}`) and
                      in `GET /api/servers` shortly afterwards, named after the cluster and its
                      layout (for example `<cluster>-worker-4`) unless `name` was given.
                    items:
                      type: object
              - $ref: ../components/schemas/200-success.yaml
          examples:
            Response:
              value:
                $ref: ../components/examples/clusterServerCreateSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml