get:
  summary: Get Monitoring Settings
  description: |
    This endpoint retrieves monitoring settings, including ServiceNow configuration
    and a read-only snapshot of logging settings.

    Logging settings are also available from `GET /api/log-settings`, which uses a
    different field naming convention (`enabled`, `retentionDays`, `minimumLogLevel`).
    Updates to logging settings should be made via `PUT /api/log-settings`.
  operationId: getMonitoringSettings
  tags:
    - Monitoring Settings
  responses:
    '200':
      description: Monitoring Settings
      content:
        application/json:
          schema:
            type: object
            properties:
              monitoringSettings:
                $ref: ../components/schemas/monitoringSettings.yaml
              loggingSettings:
                $ref: ../components/schemas/monitoringLoggingSettings.yaml
          examples:
            Monitoring Settings Response:
              value:
                $ref: ../components/examples/monitoringSettings.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Update Monitoring Settings
  description: |
    Update Monitoring Settings and nested ServiceNow settings.

    This endpoint does not update logging settings. Use `PUT /api/log-settings`
    to change logging configuration.
  operationId: updateMonitoringSettings
  tags:
    - Monitoring Settings
  requestBody:
    content:
      application/json:
        schema:
            type: object
            properties:
              monitoringSettings:
                $ref: ../components/schemas/monitoringSettings.yaml
  responses:
    '200':
      description: Update Monitoring Settings Object
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/200-success.yaml
          examples:
            Update User Response:
              value:
                $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml