get:
  summary: List Key Providers
  description: >
    Lists key providers visible to the requesting account. Provider names are
    not unique; use the numeric database `id` for show, update, and delete.
  operationId: listKeyProviders
  tags:
    - Infrastructure
  parameters:
    - $ref: ../components/parameters/max.yaml
    - $ref: ../components/parameters/offset.yaml
    - name: name
      in: query
      description: Case-insensitive substring filter for provider name.
      schema:
        type: string
    - name: phrase
      in: query
      description: Case-insensitive substring filter for provider name.
      schema:
        type: string
    - name: sort
      in: query
      description: Field to sort by.
      schema:
        type: string
        enum: [name, status, activeVersion, pendingVersion, exportedDate, dateCreated, lastUpdated]
    - name: direction
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  keyProviders:
                    type: array
                    items:
                      $ref: ../components/schemas/keyProvider.yaml
              - $ref: ../components/schemas/meta.yaml
    '4XX':
      $ref: ../components/responses/keyProviderError.yaml
    '5XX':
      $ref: ../components/responses/keyProviderError.yaml
post:
  summary: Create a Key Provider
  description: >
    Creates a key provider and its first pending KDK version. `providerId` is
    generated by the server and cannot be supplied on create. For HVM use,
    scope the provider to its cluster with `refType: ComputeServerGroup` and
    that cluster's numeric `refId`.

    A new provider starts as `pending` and cannot be used to encrypt volumes
    yet. Export it (Export a Key Provider), store the file safely, then confirm
    the export with Update a Key Provider (`status: active` and the `exportId`)
    to activate it. Only one provider can be active for a scope at a time.
    Requires the master tenant and full access to the Infrastructure: Key
    Providers permission.
  operationId: createKeyProvider
  tags:
    - Infrastructure
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [keyProvider]
          properties:
            keyProvider:
              $ref: ../components/schemas/keyProviderCreate.yaml
        examples:
          Key Provider Request:
            value:
              keyProvider:
                name: Cluster Encryption Keys
                type: internal
                refType: ComputeServerGroup
                refId: 42
                visibility: private
                tpmRequired: false
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              keyProvider:
                $ref: ../components/schemas/keyProvider.yaml
    '4XX':
      $ref: ../components/responses/keyProviderError.yaml
    '5XX':
      $ref: ../components/responses/keyProviderError.yaml
