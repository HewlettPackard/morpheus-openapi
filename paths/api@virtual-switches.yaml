get:
  summary: List Virtual Switches
  description: >-
    Retrieves the HVM virtual switches defined on a cluster.


    Requires Morpheus 9.1.0.
  operationId: listVirtualSwitches
  tags:
    - Virtual Switches
  parameters:
    - name: clusterId
      in: query
      description: The ID of the cluster (server group) to list virtual switches for.
      required: true
      schema:
        type: integer
        format: int64
      example: 135
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              virtualSwitches:
                type: array
                items:
                  $ref: ../components/schemas/virtualSwitch.yaml
          examples:
            Virtual Switches Response:
              value:
                $ref: ../components/examples/virtualSwitches.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
post:
  summary: Create a Virtual Switch
  description: >-
    Creates a virtual switch on a cluster. This is an asynchronous operation: the
    request validates and persists the desired state, seeds pending per-host
    uplinks, starts a background Process, and returns its `processId`. Poll
    `GET /api/processes/{processId}` to track host orchestration. On validation
    failure a 400 is returned with `{success: false, errors: {field: message}}`.
    A 404 is returned when the cluster is not on a virtual-switch-capable (2.0+)
    layout.


    Requires Morpheus 9.1.0.
  operationId: addVirtualSwitch
  tags:
    - Virtual Switches
  parameters:
    - name: clusterId
      in: query
      description: The ID of the cluster (server group) to create the virtual switch on.
      required: true
      schema:
        type: integer
        format: int64
      example: 135
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            virtualSwitch:
              $ref: ../components/schemas/virtualSwitchCreate.yaml
        examples:
          Virtual Switch Request:
            value:
              $ref: ../components/examples/virtualSwitchCreate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/virtualSwitchAsyncSuccess.yaml
          examples:
            Response:
              value:
                $ref: ../components/examples/virtualSwitchAsyncSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
