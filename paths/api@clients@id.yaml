get:
  summary: Get an OAuth client
  description: |
    Retrieves a specific OAuth client by id.
  operationId: getClients
  tags:
    - Clients
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                client:
                  $ref: ../components/schemas/client.yaml
          examples:
            Client Response:
              value:
                $ref: ../components/examples/client.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Update an OAuth client
  description: |
    Updates an OAuth client.

    Request body must include a `client` object. For removable clients, writable fields are
    `clientId`, `clientSecret`, `accessTokenValiditySeconds`, `refreshTokenValiditySeconds`,
    `redirectUris`, and `requireConsent`. System clients only accept token validity fields.

    On update, a `clientSecret` value starting with `********` leaves the existing secret unchanged.
  operationId: updateClients
  tags:
    - Clients
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - client
          properties:
            client:
              $ref: ../components/schemas/clientUpdate.yaml
        examples:
          Update Client:
            value:
              client:
                clientId: Test Client
                clientSecret: '************'
                accessTokenValiditySeconds: 43200
                refreshTokenValiditySeconds: 43200
                redirectUris:
                  - https://example.com/callback
                requireConsent: true
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                client:
                  $ref: ../components/schemas/client.yaml
            - $ref: ../components/schemas/200-success.yaml
          examples:
            Client Response:
              value:
                $ref: ../components/examples/clientSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
delete:
  summary: Delete an OAuth client
  description: |
    Deletes a specified OAuth client. System clients cannot be deleted.
  operationId: removeClients
  tags:
    - Clients
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
