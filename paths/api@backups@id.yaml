get:
  summary: Retrieves a Specific Backup
  description: |
    Retrieves a specific backup.
  operationId: getBackups
  tags:
    - Backups
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              backup:
                $ref: ../components/schemas/backup.yaml
          examples:
            Backup Response:
              value:
                $ref: ../components/examples/backup.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Updates a Backup
  description: |
    Updates a backup.
  operationId: updateBackups
  tags:
    - Backups
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - backup
          properties:
            backup:
              type: object
              properties:
                name: 
                  type: string
                  description: A name for the backup
                enabled:
                  type: boolean
                  description: Can be used to enable or disable the backup
                storageProviderId:
                  type:
                    - integer
                    - 'null'
                  format: int64
                  description: The ID of the storage bucket. Set to null to clear.
                backupJobId:
                  type: integer
                  format: int64
                  description: The Backup Job ID to assign the backup to. This determines when the backup is run.
                cronExpression:
                  type: string
                  description: Cron expression for custom schedule (overrides job schedule).
                targetPath:
                  type: string
                  description: The file or directory path on the target host. Applies to server/host backups (fileBackup, directoryBackup).
                targetHost:
                  type: string
                  description: Target host address. Applies to server/host and database backups.
                targetPort:
                  type: integer
                  description: Target port. Applies to server/host and database backups.
                targetUsername:
                  type: string
                  description: Target username for connecting to the backup target.
                targetPassword:
                  type: string
                  description: Target password for connecting to the backup target.
                targetAll:
                  type: boolean
                  description: Whether to backup all databases. Applies to database backup types.
                targetName:
                  type: string
                  description: Target database name. Applies when targetAll is false.
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                backup:
                  $ref: ../components/schemas/backup.yaml
            - $ref: ../components/schemas/200-success.yaml
          examples:
            Backup Response:
              value:
                $ref: ../components/examples/backupSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
delete:
  summary: Deletes a Backup
  description: |
    Deletes a specified backup.
  operationId: removeBackups
  tags:
    - Backups
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
