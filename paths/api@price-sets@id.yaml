get:
  summary: Retrieves a Specific Price Set
  description: |
    Retrieves a specific price set.
  operationId: getPriceSets
  tags:
    - Price Sets
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              priceSet:
                $ref: ../components/schemas/priceSet.yaml
          examples:
            Price Set Response:
              value:
                $ref: ../components/examples/priceSet.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Updates a Price Set
  description: |
    Updates a price set.

    Only the fields below are applied by the API. Other price set attributes
    (code, type, priceUnit, regionCode, zone, zonePool) are not updated on PUT.
  operationId: updatePriceSets
  tags:
    - Price Sets
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - priceSet
          properties:
            priceSet:
              type: object
              properties:
                name:
                  type: string
                  description: Price set name
                  example: testName
                prices:
                  type: array
                  description: |
                    Full set of prices that should remain on the price set.
                    Items are matched by price ID; omitted prices are removed
                    and new IDs are added.
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Price ID
                active:
                  type: boolean
                  description: |
                    When set to false on an active price set, deactivates the
                    price set (same effect as the deactivate endpoint).
                  example: true
                restartUsage:
                  type: boolean
                  description: |
                    When true and the update succeeds, triggers asynchronous
                    reprocessing of price usage changes.
                  example: false
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success-expanded.yaml
          examples:
            Price Sets Response:
              value:
                $ref: ../components/examples/priceSetSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
