get:
  summary: List System Storage Server Available Updates
  description: |
    List the update definitions available for a storage server that is a registered component
    of the specified system. The storage server must be a component of the system; if it is not,
    the request returns 404.

    This is a read-only operation. The `updateDefinitions` array may be empty when no updates have
    been synced for the storage server's type by its provider/plugin (for example, an array-firmware
    integration that has not yet discovered an available version) — an empty list is a normal result,
    not an error.
  operationId: listSystemStorageServerUpdates
  tags:
    - Systems
  parameters:
    - $ref: ../components/parameters/systemId-path.yaml
    - $ref: ../components/parameters/serverId-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  updateDefinitions:
                    type: array
                    items:
                      $ref: ../components/schemas/updateDefinition.yaml
              - $ref: ../components/schemas/200-success.yaml
          examples:
            List System Server Available Updates Response:
              value:
                $ref: ../components/examples/listSystemServerUpdateDefinitions.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
