get:
  summary: List available roles for an existing user
  description: |
    Get roles that can be assigned to an existing user.
    Target tenant may be selected with query `accountId` or `tenantId`.
  operationId: listUserAvailableRoles
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - name: accountId
      in: query
      description: Tenant ID for tenant-scoped lookup.
      schema:
        type: integer
        format: int64
    - name: tenantId
      in: query
      description: Alias of `accountId`.
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Array of roles
      content:
        application/json:
          schema:
            $ref: ../components/schemas/usersAvailableRoles.yaml
          examples:
            Users Available Roles Response:
              value:
                $ref: ../components/examples/usersAvailableRoles.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
