get:
  summary: Get a Specific User
  description: |
    Retrieve a specific user by id if the caller has permission to access the user.
    Pass `includeAccess=true` to embed the full access map on the user object.
  operationId: getUser
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - $ref: ../components/parameters/includeAccess.yaml
    - name: accountId
      in: query
      description: Scope lookup to a tenant (alias `tenantId` also accepted).
      schema:
        type: integer
        format: int64
    - name: tenantId
      in: query
      description: Alias of `accountId` for tenant-scoped user lookup.
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: User Object
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                $ref: ../components/schemas/user.yaml
          examples:
            Get User Response:
              value:
                $ref: ../components/examples/user.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Update user
  description: |
    Update an existing user.

    Password confirmation fields are optional for API callers when the matching password
    is supplied and the confirmation key is omitted. Explicit confirmation values are validated as-is.

    Query `accountId` / `tenantId` may scope the target user for master-tenant operators.
  operationId: updateUser
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - name: accountId
      in: query
      description: Scope update to a tenant (alias `tenantId` also accepted).
      schema:
        type: integer
        format: int64
    - name: tenantId
      in: query
      description: Alias of `accountId` for tenant-scoped user update.
      schema:
        type: integer
        format: int64
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - user
          properties:
            user:
              $ref: ../components/schemas/userUpdate.yaml
        examples:
          Update User Request:
              value:
                $ref: ../components/examples/userUpdate.json
  responses:
    '200':
      description: User Object
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                user:
                  $ref: ../components/schemas/user.yaml
                errors:
                  type: object
                  additionalProperties:
                    type: string
            - $ref: ../components/schemas/200-success.yaml
          examples:
            Update User Response:
              value:
                $ref: ../components/examples/userSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
delete:
  summary: Delete a User
  description: Delete an existing user.
  operationId: deleteUser
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - name: accountId
      in: query
      description: Scope delete to a tenant (alias `tenantId` also accepted).
      schema:
        type: integer
        format: int64
    - name: tenantId
      in: query
      description: Alias of `accountId` for tenant-scoped user delete.
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Success Object
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
          examples:
            Delete User Response:
              value:
                $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
