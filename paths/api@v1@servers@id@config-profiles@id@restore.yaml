post:
  summary: Restore a Host Configuration Profile
  description: |
    Applies a previously captured Host Configuration Profile to the host,
    enabling automation and CLI-driven workflows for host replacement.

    This endpoint requires the **infrastructure admin** role.

    Query parameters:
    - Pass `dryRun=true` to return the planned changes without applying them.
    - Pass `sections` to selectively restore only the listed configuration
      areas, e.g. `sections=netplan,storagePools`. When omitted, all supported
      sections are restored.

    Host Configuration Profiles are only supported for MVM server types. A `404`
    with a descriptive message is returned for non-MVM server types.
  operationId: restoreHostConfigProfile
  tags:
    - Hosts
  parameters:
    - $ref: ../components/parameters/serverId-path.yaml
    - $ref: ../components/parameters/id-path.yaml
    - name: dryRun
      in: query
      required: false
      description: If true, returns the planned changes without applying them to the host.
      schema:
        type: boolean
        default: false
      example: true
    - name: sections
      in: query
      required: false
      description: |
        Comma-delimited list of configuration sections to restore selectively.
        When omitted, all supported sections are restored.
      schema:
        type: array
        items:
          type: string
          enum:
            - netplan
            - storagePools
      style: form
      explode: false
      example:
        - netplan
        - storagePools
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              dryRun:
                type: boolean
                description: Indicates whether this response reflects a planned (non-applied) restore.
              plannedChanges:
                type: object
                description: Planned changes per section. Populated when `dryRun=true`.
                additionalProperties: true
              processIds:
                type: array
                description: Process ID(s) to track execution results with, use `/api/processes/{id}`.
                items:
                  type: integer
                  format: int64
          examples:
            Dry Run Response:
              value:
                $ref: ../components/examples/hostConfigProfileRestoreDryRun.json
            Apply Response:
              value:
                $ref: ../components/examples/hostConfigProfileRestoreSuccess.json
    '403':
      description: The caller does not hold the infrastructure admin role.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            success: false
            msg: Access Denied
    '404':
      description: Profile not found, host not found, or the host type does not support restore.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            success: false
            msg: Host configuration profiles are only supported for MVM server types
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml

