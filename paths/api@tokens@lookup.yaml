post:
  summary: Lookup a Token
  description: |
    Look up one of your own tokens by its access token value. The value is sent in the request
    body rather than a query parameter so it does not appear in access logs.
    Returns 404 when no matching token is found for the user.
  operationId: lookupToken
  tags:
    - Tokens
  parameters:
    - name: userId
      in: query
      description: ID of User to look up the token for. Operating on a user other than your own requires admin permissions to manage users.
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - token
          properties:
            token:
              type: string
              description: The access token value to look up.
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  token:
                    $ref: ../components/schemas/token.yaml
              - $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
