get:
  summary: Get a Specific Network Domain
  description: |
    This endpoint retrieves a specific Network Domain.
  operationId: getNetworkDomain
  tags:
    - Networks
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              networkDomain:
                $ref: ../components/schemas/networkDomain.yaml
          examples:
            Successful Response:
              value:
                $ref: ../components/examples/networkDomain.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml

put:
  summary: Update a Network Domain
  description: |
    Update a Network Domain.
  operationId: updateNetworkDomain
  tags:
    - Networks
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody: 
    content: 
      application/json: 
        schema: 
          type: object
          properties: 
            networkDomain:
              $ref: ../components/schemas/networkDomainUpdate.yaml
        examples: 
          Successful Request:
            value: 
              $ref: ../components/examples/networkDomainCreate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              networkDomain:
                $ref: ../components/schemas/networkDomain.yaml
          examples:
            Successful Response:
              value:
                $ref: ../components/examples/networkDomain.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml

delete:
  summary: Delete a Network Domain
  description: Will delete a Network Domain from the system and make it no longer usable.
  operationId: deleteNetworkDomain
  tags:
    - Networks
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
          examples:
            Response:
              value:
                $ref: ../components/examples/success.json 
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml