get:
  summary: Get all Network Router NATs for Network Router
  description: |
    This endpoint retrieves all NATs for specified network router.
  operationId: getNetworkRoutersNats
  tags:
    - Networks
  parameters:
    - $ref: ../components/parameters/routerId-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              networkRouterNATs:
                type: array
                items:
                  $ref: ../components/schemas/networkRouterNat.yaml
          examples:
            Network Router NATs Response:
              value:
                $ref: ../components/examples/networkRoutersNats.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml

post: 
  summary: Create a Network Router NAT
  description: Use this command to create a NAT for an existing network router.
  operationId: createNetworkRouterNat
  tags:
    - Networks
  parameters:
    - $ref: ../components/parameters/routerId-path.yaml
  requestBody: 
    content: 
      application/json: 
        schema: 
          type: object
          properties: 
            networkRouterNAT:
              type: object
              description: For a full list of available NAT options, see natOptionTypes in the specific Network Router Type
              required:
                - name
                - config
              properties:
                name:
                  type: string
                  description: NAT name
                description:
                  type: string
                  description: Description of the NAT rule.
                enabled:
                  type: boolean
                  description: Whether the NAT rule is enabled.
                sourceNetwork:
                  type: string
                  description: Source network for the NAT rule.
                destinationNetwork:
                  type: string
                  description: Destination network for the NAT rule.
                translatedNetwork:
                  type: string
                  description: Translated network for the NAT rule.
                sourcePorts:
                  type: string
                  description: Source ports for the NAT rule.
                destinationPorts:
                  type: string
                  description: Destination ports for the NAT rule.
                translatedPorts:
                  type: string
                  description: Translated ports for the NAT rule.
                priority:
                  type: integer
                  format: int64
                  description: Priority of the NAT rule.
                protocol:
                  type: string
                  description: Protocol for the NAT rule.
                config:
                  type: object
                  description: NAT config-context options (bound to the NAT's config map).
                  required:
                    - action
                  properties:
                    action:
                      type: string
                      description: >-
                        The NAT action (config-context). NSX-T values: SNAT, DNAT,
                        NO_SNAT, NO_DNAT, REFLEXIVE.
                    firewall:
                      type: string
                      description: >-
                        Firewall match mode for the NAT rule (config-context). NSX-T
                        values: MATCH_EXTERNAL_ADDRESS, MATCH_INTERNAL_ADDRESS, BYPASS.
                    service:
                      type: string
                      description: >-
                        Service the NAT rule applies to (config-context). For NSX-T this
                        is a service path, for example /infra/services/HTTP.
        examples: 
          Network Router NAT Request:
            value:
              $ref: ../components/examples/networkRouterNatCreate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/successId.yaml
          examples: 
            Successful Request:
              value:
                $ref: ../components/examples/successId.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
