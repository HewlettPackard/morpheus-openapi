get:
  summary: List available roles for a tenant user
  description: Roles available to assign to an existing user in the given tenant.
  operationId: listTenantUserAvailableRoles
  tags:
    - Tenants
  parameters:
    - $ref: ../components/parameters/accountId-path.yaml
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Array of roles
      content:
        application/json:
          schema:
            $ref: ../components/schemas/usersAvailableRoles.yaml
          examples:
            Users Available Roles Response:
              value:
                $ref: ../components/examples/usersAvailableRoles.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
