get:
  summary: Retrieves a Specific Storage Server
  description: |
    Retrieves a specific storage server.
  operationId: getStorageServers
  tags:
    - Storage
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              storageServer:
                $ref: ../components/schemas/storageServer.yaml
          examples:
            Storage Server Response:
              value:
                $ref: ../components/examples/storageServer.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Updates a Storage Server
  description: |
    Updates a storage server.
  operationId: updateStorageServers
  tags:
    - Storage
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - storageServer
          properties:
            storageServer:
              type: object
              properties:
                name:
                  type: string
                  description: Name
                type:
                  type: string
                  description: The `Storage Type` Code or ID
                description:
                  type: string
                  description: description
                enabled:
                  type: boolean
                  description: The enabled flag
                  default: true
                config:
                  type: object
                  description: Configuration object with parameters that vary by `type`
                visibility:
                  type: string
                  description: private or public
                  enum:
                    - private
                    - public
                  default: private
                serviceHost:
                  type: string
                  description: Storage server host
                serviceUrl:
                  type: string
                  description: Storage server URL
                serviceUsername:
                  type: string
                  description: Service username for authentication
                servicePassword:
                  type: string
                  description: Service password for authentication
                  format: password
                servicePort:
                  type: integer
                  description: Service port
                  format: int32
                credential:
                  type: object
                  description: Credential configuration. Use `type` of `local` for local credentials or `type` of the credential store integration code.
                  properties:
                    type:
                      type: string
                      description: Credential type code or `local`
                    id:
                      type: integer
                      format: int64
                      description: Credential ID (for non-local types)
                tenants:
                  type: array
                  description: Array of tenant account ids that are allowed access
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                storageServer:
                  $ref: ../components/schemas/storageServer.yaml
            - $ref: ../components/schemas/200-success.yaml
          examples:
            Storage Server Response:
              value:
                $ref: ../components/examples/storageServerSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
delete:
  summary: Deletes a Storage Server
  description: |
    Deletes a specified storage server.
  operationId: removeStorageServers
  tags:
    - Storage
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml