put:
  summary: Discard a Pending Key Version
  description: >
    Discards the provider's pending key version, which was generated by a rotation and never confirmed. The version's
    key material is destroyed and the provider keeps using its active version. Fails with `no_pending_version` when
    the provider has no pending version to discard. Requires the master tenant and full access to the Infrastructure:
    Key Providers permission.
  operationId: discardKeyProviderPendingVersion
  tags:
    - Infrastructure
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              keyProvider:
                $ref: ../components/schemas/keyProvider.yaml
    '4XX':
      $ref: ../components/responses/keyProviderError.yaml
    '5XX':
      $ref: ../components/responses/keyProviderError.yaml
