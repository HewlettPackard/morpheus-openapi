get:
  summary: Get all Network Groups
  description: |
    This endpoint retrieves all Network Groups associated with the account.
  operationId: getNetworkGroups
  tags:
    - Networks
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              networkGroups:
                type: array
                items:
                  type: object
                  properties:
                    $ref: ../components/schemas/networkGroup.yaml
          examples:
            Network Groups Response:
              value:
                $ref: ../components/examples/networkGroups.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml

post:
  summary: Create a Network Group
  description: |
    Use this command to create a network group.
  operationId: createNetworkGroup
  tags:
    - Networks
  requestBody: 
    content: 
      application/json: 
        schema: 
          type: object
          properties: 
            networkGroup:
              $ref: ../components/schemas/networkGroupsCreate.yaml
            tenantPermissions:
              type: object
              properties:
                accounts:
                  type: array
                  description: Array of tenant account IDs
                  items:
                    type: integer
                    format: int64
            resourcePermissions:
              type: object
              properties:
                all:
                  type: boolean
                  description: Pass true to allow access to all groups
                sites:
                  type: array
                  description: Array of groups that are allowed access
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                allPlans:
                  type: boolean
                  description: Pass true to allow access to all service plans
                plans:
                  type: array
                  description: Array of service plan IDs that are allowed access
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
        examples: 
          Successful Request:
            value: 
              $ref: ../components/examples/networkGroupsCreate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/successId.yaml
          examples:
            Networks Response:
              value:
                $ref: ../components/examples/successId.json 
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml