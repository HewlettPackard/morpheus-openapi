post:
  summary: Export a Key Provider
  description: >
    Exports the provider's key (KDK) versions as a single passphrase-encrypted `.mkpx` file. Every version that has
    not been deleted is included: the active version and any retired or pending versions. This is the only way to get
    key material out of Morpheus, and it is how a provider is backed up before it can be activated. Exporting a
    `pending` provider moves it to `exported`; a provider that is already active stays active. The export ID returned
    in the `X-Key-Provider-Export-Id` response header must then be sent as `exportId` in an Update a Key Provider
    request with `status: active` to confirm that the export was stored safely, which also confirms a version
    generated by rotating an active provider.

    The passphrase protects the file and must be at least 14 characters (and at most 256 UTF-8 bytes). Keep it with
    the file: it is required to import the provider again, and it cannot be recovered. The passphrase must be sent in
    the JSON request body. A request that passes it in the query string is rejected.

    The response is the export file itself, sent as an attachment and never cached. Verify the download against the
    SHA-256 checksum in `X-Key-Provider-Export-Sha256`. Requires the master tenant and full access to the
    Infrastructure: Key Providers permission.
  operationId: exportKeyProvider
  tags:
    - Infrastructure
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [passphrase]
          properties:
            passphrase:
              type: string
              format: password
              minLength: 14
              description: Passphrase used to encrypt the export file. At least 14 characters, at most 256 UTF-8 bytes.
        examples:
          Export Request:
            value:
              passphrase: correct horse battery staple
  responses:
    '200':
      description: The export file.
      headers:
        Content-Disposition:
          description: Attachment header naming the file, for example `key-provider-<providerId>-v1.mkpx`.
          schema:
            type: string
            example: 'attachment; filename="key-provider-9f1c2a4e-3b7d-4c68-8a51-0e2d7b6f9a13-v1.mkpx"'
        Cache-Control:
          schema:
            type: string
            example: no-store
        X-Key-Provider-Export-Id:
          description: >-
            ID of this export. Send it as `exportId` in an Update a Key Provider request with `status: active` to
            confirm the export.
          schema:
            type: string
            example: 6c1e0c2e-8a63-4b5d-9d52-2f1f3f0b7a44
        X-Key-Provider-Export-Sha256:
          description: SHA-256 checksum of the export file, as 64 hexadecimal characters.
          schema:
            type: string
            example: 3b7d0a1c9e8f4a62b5d17c0e4f2a8b9d6c3e1f5a7b0d2c4e6f8a1b3d5c7e9f02
      content:
        application/json:
          schema:
            type: string
            format: binary
            description: The passphrase-encrypted export file. Treat it as opaque and store it as received.
    '4XX':
      $ref: ../components/responses/keyProviderError.yaml
    '5XX':
      $ref: ../components/responses/keyProviderError.yaml
