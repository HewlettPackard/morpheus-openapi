delete:
  summary: Delete Snapshot of a Datastore
  description: |
    Deletes a datastore-wide snapshot through the datastore provider and removes
    its record after the provider reports success. The snapshot must belong to
    the specified datastore, have `snapshotScope: DATASTORE`, and have status `complete`.
    Snapshots in other states cannot be deleted. If the datastore's `currentSnapshot`
    references the deleted snapshot, that reference is cleared.
    The existing shared endpoint `DELETE /api/snapshots/{id}` also supports datastore
    snapshots; pass the snapshot ID as `{id}`. Both routes use the same provider
    operation and authorization checks.

    Requires full access to both Infrastructure: Storage (`infrastructure-storage`)
    and Infrastructure: Clusters (`infrastructure-cluster`). The datastore must be
    owned by the current account and its provider must support datastore snapshots.
    Cluster-scoped datastores also require access to the owning cluster.
    This endpoint is also available under `/api/v1`.
  operationId: deleteDatastoreSnapshot
  tags:
    - Datastores
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - name: snapshotId
      in: path
      description: ID of the datastore snapshot.
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Snapshot deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              msg:
                type:
                  - string
                  - 'null'
              errors:
                type:
                  - object
                  - 'null'
          examples:
            Response:
              value:
                success: true
                msg: null
                errors: {}
    '400':
      description: Provider does not support datastore snapshots, the snapshot is not complete, or provider deletion failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            Snapshot Busy:
              value:
                success: false
                msg: "Snapshot 'before-maintenance' is currently 'creating'; cannot delete until the current operation completes"
                errors: {}
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
