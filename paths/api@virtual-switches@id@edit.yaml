put:
  summary: Composite Edit a Virtual Switch
  description: >-
    Applies switch-level changes, adds new segments, and edits existing segments
    in a single asynchronous operation. This avoids the sync-guard conflicts that
    sequential update/add/edit calls would cause. Returns a `processId`; poll
    `GET /api/processes/{processId}` to track host orchestration. On validation
    failure a 400 is returned with `{success: false, errors: {field: message}}`.


    Requires Morpheus 9.1.0.
  operationId: compositeEditVirtualSwitch
  tags:
    - Virtual Switches
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/virtualSwitchCompositeEdit.yaml
        examples:
          Composite Edit Request:
            value:
              $ref: ../components/examples/virtualSwitchCompositeEdit.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/virtualSwitchAsyncSuccess.yaml
          examples:
            Response:
              value:
                $ref: ../components/examples/virtualSwitchAsyncSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
