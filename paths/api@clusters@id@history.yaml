get: 
  summary: Get Cluster History
  description: This endpoint retrieves the process history for a specific cluster.
  operationId: getClusterHistory
  tags: 
    -  Clusters
  parameters:
    - $ref: ../components/parameters/clusterId-path.yaml
    - $ref: ../components/parameters/max.yaml
    - $ref: ../components/parameters/offset.yaml
    - name: sort
      in: query
      description: The process property to sort by. Entries have no `name`; the default is the start date.
      schema:
        type: string
        default: startDate
    - name: direction
      in: query
      description: Sort direction. The default lists the newest entries first.
      schema:
        type: string
        default: desc
        enum:
          - asc
          - desc
    - $ref: ../components/parameters/phrase.yaml
  responses:
    '200':
      description: Successful Request
      content: 
        application/json: 
          schema:
            allOf:
              - type: object
                properties:
                  processes:
                    type: array
                    items:
                      $ref: ../components/schemas/clusterHistory.yaml
              - $ref: ../components/schemas/meta.yaml
          examples:
            Cluster Request:
              value:
                $ref: ../components/examples/clusterHistory.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml