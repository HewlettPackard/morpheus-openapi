put:
  summary: Customizing App Template Access
  description: >
    Alias of `PUT /api/roles/{id}/update-blueprint`. Same request body and behavior
    (blueprint / app template resource grants).

    Body accepts `appTemplateId`, `blueprintId` / `bluePrintId`, or `allAppTemplates` /
    `allBlueprints` with `access`. Use `access: default` to clear the grant.
  operationId: updateRoleAppTemplateAccess
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  tags:
    - Roles
  requestBody:
    content:
      application/json:
        schema:
          oneOf:
            - $ref: ../components/schemas/rolePermissionBlueprint.yaml
            - $ref: ../components/schemas/rolePermissionBlueprintAll.yaml
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  access:
                    type: string
              - $ref: ../components/schemas/200-success.yaml
          examples:
            Role Permission Response:
              value:
                $ref: ../components/examples/updateRolePermissionResponse.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
