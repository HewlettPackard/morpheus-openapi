get:
  summary: Get a Specific User Permissions
  description: |
    List all access grants for a specific user (features, clouds/zones, groups/sites,
    instance types, app templates, catalog item types, personas, VDI pools, report types,
    tasks, and task sets / workflows).

    This is the preferred permissions endpoint (`access` action). The older
    `GET /api/users/{id}/feature-permissions` endpoint is deprecated.
  operationId: getUserPermissions
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - name: accountId
      in: query
      description: Tenant ID for tenant-scoped lookup.
      schema:
        type: integer
        format: int64
    - name: tenantId
      in: query
      description: Alias of `accountId`.
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: User access object
      content:
        application/json:
          schema:
            type: object
            properties:
              access:
                $ref: ../components/schemas/userPermissions.yaml
          examples:
            Get User Permissions Response:
              value:
                $ref: ../components/examples/userPermissions.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
