get:
  summary: Get Cluster Layout Package Config (Kubernetes)
  description: |
    Returns the default package configuration. Applies to configurable enabled
    Kubernetes packages in the layout, whether required or optional.

    Requires read, user, or full access to Library > Cluster Layouts
    (`admin-containers`) or Infrastructure > Clusters (`infrastructure-cluster`).
    The enabled layout must be global or owned by the current account, and its
    cluster type must be visible to the user; otherwise HTTP 404 is returned.
  operationId: getClusterLayoutPackageConfig
  tags:
    - Cluster Layouts
  parameters:
    - $ref: ../components/parameters/layoutId-path.yaml
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              config:
                $ref: ../components/schemas/clusterLayoutPackageConfig.yaml
          examples:
            Cluster Layout Package Config Response:
              value:
                $ref: ../components/examples/clusterLayoutPackageConfig.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
