put:
  summary: Acknowledge many health alarms
  description: |
    Acknowledge or unacknowledge one or more health alarms.

    `POST` is also accepted. When `acknowledged` is omitted it defaults to `true`.
    `all=true` acknowledges every active unacknowledged alarm; unacknowledge-all
    is not supported.
  operationId: acknowledgeHealthAlarms
  tags:
    - Health
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            acknowledged:
              type: boolean
              description: |
                `true` to acknowledge, `false` to unacknowledge. Defaults to `true`
                when omitted. May also be sent as `alarm.acknowledged`.
              default: true
            alarm:
              type: object
              properties:
                acknowledged:
                  type: boolean
            ids:
              type: array
              description: Alarm IDs to update. Query aliases include `ids[]`, `id`, `alarmIds[]`.
              items:
                type:
                  - integer
                  - string
            all:
              type: boolean
              description: When true, acknowledge all active unacknowledged alarms (acknowledge only).
              default: false
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
post:
  summary: Acknowledge many health alarms
  description: |
    Same as `PUT /api/health/alarms/acknowledge`.
  operationId: acknowledgeHealthAlarmsPost
  tags:
    - Health
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            acknowledged:
              type: boolean
              default: true
            alarm:
              type: object
              properties:
                acknowledged:
                  type: boolean
            ids:
              type: array
              items:
                type:
                  - integer
                  - string
            all:
              type: boolean
              default: false
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
