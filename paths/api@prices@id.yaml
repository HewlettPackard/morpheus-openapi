get:
  summary: Retrieves a Specific Price
  description: |
    Retrieves a specific price.
  operationId: getPrices
  tags:
    - Prices
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              price:
                $ref: ../components/schemas/price.yaml
          examples:
            Price Response:
              value:
                $ref: ../components/examples/price.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Updates a Price
  description: |
    Updates a price.

    `code` and `account` on the request are ignored; the existing price values are kept.
    Software prices may send `software` or `softwareOrService`. Request `priceType`
    value `software` is stored as `software_or_service`.
  operationId: updatePrices
  tags:
    - Prices
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - price
          properties:
            price:
              type: object
              properties:
                name: 
                  type: string
                  description: Price name
                code:
                  type: string
                  description: Price code, must be unique
                account:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                      description: Assign to specified tenant account
                priceType:
                  type: string
                  description: |
                    Restricts query to only load only prices with specified priceType.
                    * `fixed` - Everything
                    * `compute` - Memory + CPU
                    * `memory` - Memory
                    * `cores` - Cores
                    * `storage` - Storage
                    * `datastore` - Datastore
                    * `platform` - Platform
                    * `software` - Software (accepted alias; stored as software_or_service)
                    * `software_or_service` - Software or service
                    * `cpu` - CPU
                    * `load_balancer` - Load Balancer
                    * `load_balancer_virtual_server` - Load Balancer Virtual Server
                  enum:
                    - fixed
                    - compute
                    - memory
                    - cores
                    - cpu
                    - storage
                    - datastore
                    - platform
                    - software
                    - software_or_service
                    - load_balancer
                    - load_balancer_virtual_server
                priceUnit:
                  type: string
                  description: The unit of pricing
                  enum:
                    - minute
                    - hour
                    - day
                    - month
                    - year
                    - two year
                    - three year
                    - four year
                    - five year
                incurCharges:
                  type: string
                  description: Indicates when to incur charge
                  enum:
                    - running
                    - stopped
                    - always
                currency:
                  type: string
                  description: ISO Currency code
                  example: USD
                cost:
                  type: number
                  description: Cost
                  example: 10.5
                markupType:
                  type: string
                  description: Price adjustment type
                  enum:
                    - fixed
                    - percent
                    - custom
                markup:
                  type: number
                  description: Amount for `fixed` price adjustment type
                  example: 2.5
                markupPercent:
                  type: number
                  description: Percent for `percent` price adjustment type
                  example: 13.5
                customPrice:
                  type: number
                  description: Custom price for `custom` price adjustment type
                  example: 12.25
                platform:
                  type: string
                  description: Platform.  Required for `platform` price type
                  example: linux
                software:
                  type: string
                  description: |
                    Software or service name for software prices.
                    Accepted as an alias for `softwareOrService`; when `priceType`
                    is `software`, the API stores type `software_or_service`.
                softwareOrService:
                  type: string
                  description: |
                    Software or service name.
                    Required when price type is software / software_or_service.
                volumeType:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                      description: |
                        Volume type ID, required for `storage` price type.
                        The endpoint /api/prices/volume-types provides a list of available volume type options.
                datastore:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                      description: |
                        Datastore ID.  Required for datastore price type
                crossCloudApply:
                  type: boolean
                  description: Apply price across clouds, optional true/false flag for datastore price type
            restartUsage:
              type: boolean
              description: |
                When true (or the string `on`) and the update succeeds, triggers
                asynchronous reprocessing of price usage changes. Request-root field
                (not inside `price`).
              example: true
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml