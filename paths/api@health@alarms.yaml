get:
  summary: List health alarms
  description: |
    Returns health alarms synced from clouds and other integrations (operation
    notifications). These are not generated by the appliance process itself.

    Defaults: `max` 50, `sort` `startDate`, order `desc`, `alarmStatus` `open`
    (active and not acknowledged). The list is also limited to active alarms.
    `phrase` matches `name` or `resourceName`.
  operationId: listHealthAlarms
  tags:
    - Health
  parameters:
    - $ref: ../components/parameters/max.yaml
    - $ref: ../components/parameters/offset.yaml
    - $ref: ../components/parameters/sort.yaml
    - $ref: ../components/parameters/direction.yaml
    - name: order
      in: query
      description: Alias for `direction`
      schema:
        type: string
    - $ref: ../components/parameters/phrase.yaml
    - name: alarmStatus
      in: query
      description: |
        Convenience filter over `active` / `acknowledged`. Default `open`.
      schema:
        type: string
        enum:
          - open
          - acknowledged
          - active
        default: open
    - name: acknowledged
      in: query
      schema:
        type: boolean
    - name: active
      in: query
      schema:
        type: boolean
    - name: status
      in: query
      description: Alarm severity/status value (may be specified more than once)
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
    - name: alarmCategory
      in: query
      description: |
        Filters by related resource type (`refType`). Common values include
        `computeZone`, `computeServer`, `datastore`, `accountIntegration`,
        `storageServer`, `backupProvider`, `replicationSite`, `replicationGroup`.
      schema:
        type: string
    - name: refType
      in: query
      description: Alias for `alarmCategory`
      schema:
        type: string
    - name: category
      in: query
      schema:
        type: string
    - $ref: ../components/parameters/startDate.yaml
    - $ref: ../components/parameters/endDate.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                alarms:
                  type: array
                  items:
                    $ref: ../components/schemas/alarm.yaml
            - $ref: ../components/schemas/meta.yaml
          examples:
            Health Alarms Response:
              value:
                $ref: ../components/examples/alarms.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
