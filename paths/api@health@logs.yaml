get:
  summary: List appliance health logs
  description: |
    Returns Morpheus appliance UI logs. Useful for troubleshooting. Stack traces
    are filtered; full traces are on the appliance under
    `/var/log/morpheus/morpheus-ui/current`.

    Defaults: `max` 25, `sort` `ts`, order `desc`.
    `phrase` is an alias of `query`.
  operationId: listHealthLogs
  tags:
    - Health
  parameters:
    - $ref: ../components/parameters/max.yaml
    - $ref: ../components/parameters/offset.yaml
    - $ref: ../components/parameters/sort.yaml
    - $ref: ../components/parameters/direction.yaml
    - name: order
      in: query
      description: Alias for `direction`
      schema:
        type: string
    - $ref: ../components/parameters/phrase.yaml
    - name: query
      in: query
      description: Alias for `phrase`
      schema:
        type: string
    - name: level
      in: query
      description: Log level filter (for example `INFO`, `WARN`, `ERROR`)
      schema:
        type: string
    - $ref: ../components/parameters/startDate.yaml
    - $ref: ../components/parameters/endDate.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                logs:
                  type: array
                  items:
                    $ref: ../components/schemas/healthLogs.yaml
            - $ref: ../components/schemas/meta.yaml
          examples:
            Health Logs Response:
              value:
                $ref: ../components/examples/healthLogs.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
