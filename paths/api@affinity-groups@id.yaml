get:
  summary: Get a Specific Affinity Group
  description: >-
    Retrieve a specific affinity group by its ID, without needing to know
    whether it is scoped to a cluster or a cloud. The returned `refType` and
    `refId` identify the owning scope.
  operationId: getAffinityGroup
  tags:
    - Affinity Groups
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              affinityGroup:
                $ref: ../components/schemas/affinityGroup.yaml
          examples:
            Get Affinity Group Response:
              value:
                $ref: ../components/examples/clusterAffinityGroupSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Update an Affinity Group
  description: >-
    Update a specific affinity group by its ID, regardless of whether it is
    scoped to a cluster or a cloud.

    A rule is either a legacy VM-to-VM rule (`servers` populated) or a combined
    VM-to-Host rule (`vmGroup` and `hostGroup` populated). Sending both shapes,
    or only one half of a combined rule, is rejected with a 400.
  operationId: updateAffinityGroup
  tags:
    - Affinity Groups
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            affinityGroup:
              $ref: ../components/schemas/affinityGroupUpdate.yaml
            tenantPermissions:
              type: object
              properties:
                accounts:
                  type: array
                  description: Array of tenant account IDs
                  items:
                    type: integer
                    format: int64
        examples:
          Update Combined VM-to-Host Rule Request:
            value:
              $ref: ../components/examples/affinityGroupCombinedUpdate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  affinityGroup:
                    $ref: ../components/schemas/affinityGroup.yaml
              - $ref: ../components/schemas/200-success.yaml
          examples:
            Update Affinity Group Response:
              value:
                $ref: ../components/examples/affinityGroupCombinedSuccess.json
    '400':
      $ref: ../components/responses/affinityGroup400.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
delete:
  summary: Delete an Affinity Group
  description: >-
    Delete a specific affinity group by its ID, regardless of whether it is
    scoped to a cluster or a cloud.
  operationId: deleteAffinityGroup
  tags:
    - Affinity Groups
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/200-success.yaml
          examples:
            Response:
              value:
                $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
