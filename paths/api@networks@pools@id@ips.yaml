get:
  summary: Get all IP Addresses for a Specific Network Pool
  description: |
    This endpoint retrieves a list of IP addresses for a specific Network Pool.
  operationId: getNetworkPoolIps
  tags:
    - Networks
  parameters:
    - $ref: ../components/parameters/id-path.yaml
    - name: phrase
      in: query
      description: Search phrase for partial matches on ipAddress or hostname
      schema:
        type: string
    - name: ipAddress
      in: query
      description: If specified will return an exact match on ipAddress
      schema:
        type: string
    - name: hostname
      in: query
      description: If specified will return an exact match on hostname
      schema:
        type: string
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                networkPoolIps:
                  type: array
                  items:
                    type: object
                    properties:
                      $ref: ../components/schemas/networkPoolIp.yaml
            - $ref: ../components/schemas/meta.yaml
          examples:
            Networks Response:
              value:
                $ref: ../components/examples/networkPoolIps.json
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '405':
      $ref: ../components/responses/405.yaml
    '406':
      $ref: ../components/responses/406.yaml
    '410':
      $ref: ../components/responses/410.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml

post:
  summary: Create a Network Pool IP Address
  description: |
    Create an IP Address for a Specific Network Pool
  operationId: createNetworkPoolIp
  tags:
    - Networks
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            networkPoolIp:
              $ref: ../components/schemas/networkPoolIpCreate.yaml
            createDns:
              type: boolean
              description: >-
                Create DNS A and PTR records for the address in the domain given by
                networkPoolIp.domain. A domain must be selected when this is set.
              default: false
        examples:
          Network Pool Request:
            value:
              $ref: ../components/examples/networkPoolIpCreate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/200-success.yaml
              - type: object
                properties:
                  networkPoolIp:
                    type: object
                    properties:
                      $ref: ../components/schemas/networkPoolIp.yaml
          examples:
            Successful Response:
              value:
                $ref: ../components/examples/networkPoolIpSuccess.json
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '405':
      $ref: ../components/responses/405.yaml
    '406':
      $ref: ../components/responses/406.yaml
    '410':
      $ref: ../components/responses/410.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml