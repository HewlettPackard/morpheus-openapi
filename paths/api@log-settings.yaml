get:
  summary: List All Log Settings
  description: |
    This endpoint retrieves log settings, including enabled state, minimum log
    level, retention days, and syslog rules.

    A subset of logging settings is also returned from `GET /api/monitoring-settings`
    under `loggingSettings` using internal field names (`logsEnabled`,
    `logRetainmentPeriod`). Prefer this endpoint for full log settings management.
  operationId: listLogSettings
  tags:
    - Log Settings
  responses:
    '200':
      description: Log Settings
      content:
        application/json:
          schema:
            type: object
            properties:
              logSettings:
                $ref: ../components/schemas/logSettings.yaml
          examples:
            Log Settings Response:
              value:
                $ref: ../components/examples/logSettings.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Update Log Settings
  description: |
    Update log settings. Supported fields include `enabled`, `minimumLogLevel`,
    `retentionDays`, and `syslogRules`.
  operationId: updateLogSettings
  tags:
    - Log Settings
  requestBody:
    content:
      application/json:
        schema:
            type: object
            properties:
              logSettings:
                $ref: ../components/schemas/logSettings.yaml
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/200-success.yaml
          examples:
            Update Log Settings Response:
              value:
                $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
