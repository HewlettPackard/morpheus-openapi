get:
  summary: Get Log Settings
  description: This endpoint retrieves log settings.
  operationId: listLogSettings
  tags:
    - Log Settings
  responses:
    '200':
      description: Log Settings
      content:
        application/json:
          schema:
            type: object
            properties:
              logSettings:
                $ref: ../components/schemas/logSettings.yaml
          examples:
            Log Settings Response:
              value:
                $ref: ../components/examples/logSettings.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Update Log Settings
  description: Update Log Settings
  operationId: updateLogSettings
  tags:
    - Log Settings
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - logSettings
          properties:
            logSettings:
              $ref: ../components/schemas/logSettingsUpdate.yaml
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/200-success.yaml
              - type: object
                properties:
                  msg:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: string
                    description: Field validation errors when success is false
          examples:
            Update Log Settings Response:
              value:
                $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
