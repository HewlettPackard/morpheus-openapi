get:
  summary: Get appliance health
  description: |
    Returns the latest cached appliance health snapshot (CPU, memory, threads,
    database, storage, Elasticsearch, and RabbitMQ).

    Cached samples older than about six minutes are ignored; if none are found
    the window extends to about twenty minutes. When no cached sample is
    available, the `health` object may be empty.

    Pass `live=true` for an on-demand sample (same payload as `GET /api/health/live`),
    including a full Elasticsearch index list.
  operationId: listHealth
  tags:
    - Health
  parameters:
    - name: live
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: When true, collect health on demand instead of using the cache.
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              health:
                $ref: ../components/schemas/health.yaml
          examples:
            Health Response:
              value:
                $ref: ../components/examples/health.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
