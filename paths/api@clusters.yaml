get:
  summary: Get All Clusters
  description: This endpoint retrieves all clusters and a list of clusters associated with the zone by id.
  operationId: listClusters
  tags:
    - Clusters
  parameters:
    - $ref: ../components/parameters/max.yaml
    - $ref: ../components/parameters/offset.yaml
    - $ref: ../components/parameters/sort.yaml
    - $ref: ../components/parameters/direction.yaml
    - $ref: ../components/parameters/phrase.yaml
    - $ref: ../components/parameters/name.yaml
    - $ref: ../components/parameters/zoneId.yaml
    - $ref: ../components/parameters/typeId.yaml
    - $ref: ../components/parameters/labels.yaml
    - $ref: ../components/parameters/allLabels.yaml
    - $ref: ../components/parameters/clustersUuid.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                clusters:
                  type: array
                  items:
                    $ref: ../components/schemas/clusters.yaml
            - $ref: ../components/schemas/meta.yaml
          examples:
            Clusters Response:
              value:
                $ref: ../components/examples/clusters.json 
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
post: 
  summary: Create a Cluster
  description: |
    This endpoint will create a cluster.

    For HKS layouts, `cluster.packages` can select optional packages and supply
    YAML overrides for configurable required or optional packages. Use package
    IDs or codes returned by the cluster layout packages endpoint. A selection
    without `config` uses the package defaults.

    Invalid package selections or configuration return HTTP 400 before creation,
    with validation errors under `errors.packages` or `errors["packages[index]"]`.
    Packages must be enabled Kubernetes packages belonging to the layout.
    Nonempty package selections require an HKS layout. Conflicting duplicate
    selections, mismatched IDs and codes, and blank or invalid YAML are rejected.
    Package selections and overrides are persisted before provisioning is queued.
  operationId: addCluster
  tags: 
    -  Clusters
  requestBody: 
    content: 
      application/json: 
        schema: 
          type: object
          properties: 
            cluster:
              $ref: ../components/schemas/clusterCreate.yaml
        examples:
          Cluster Request:
            value:
              $ref: ../components/examples/clusterRequest.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf: 
            - type: object
              properties:
                cluster:
                  $ref: ../components/schemas/cluster.yaml
            - $ref: ../components/schemas/200-success.yaml
          examples:
            Cluster Response:
              value:
                $ref: ../components/examples/clusterCreate.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml