put:
  summary: Detach Host Profile from Cluster
  description: Clears the host profile from the cluster and from every host in the cluster. Also deletes all HostProfileCompliance records for the detached hosts — no stale compliance data remains after detach.
  operationId: detachClusterHostProfile
  tags:
    - Host Profiles
  parameters:
    - $ref: ../components/parameters/clusterId-path.yaml
  responses:
    '200':
      description: Profile detached successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
          example:
            $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
