post:
  summary: Create a New Syslog Rule
  description: Creates a new syslog rule. This command will also update existing syslog rule by specified name if already exists
  operationId: addLogSettingsSyslogRules
  tags:
    - Log Settings
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - syslogRule
          properties:
            syslogRule:
              type: object
              description: Payload for creating a new syslog rule
              required:
                - name
                - rule
              properties:
                name:
                  type: string
                  description: Name of rule
                  example: foo
                rule:
                  type: string
                  description: Rule configuration
                  example: "*.* @@bar.com:8080"
  responses:
    '200':
      description: Syslog Rule Response
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/200-success.yaml
              - type: object
                properties:
                  msg:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: string
          examples:
            Successful Response:
              value:
                $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
