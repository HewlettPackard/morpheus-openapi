get:
  summary: Get all Host Configuration Profiles for a Host
  description: |
    Retrieves a list of Host Configuration Profiles captured for a specific host.

    This endpoint requires the **infrastructure admin** role.

    Host Configuration Profiles are only supported for MVM server types. A `404`
    with a descriptive message is returned for non-MVM server types.
  operationId: listHostConfigProfiles
  tags:
    - Hosts
  parameters:
    - $ref: ../components/parameters/serverId-path.yaml
    - $ref: ../components/parameters/max.yaml
    - $ref: ../components/parameters/offset.yaml
    - $ref: ../components/parameters/sort.yaml
    - $ref: ../components/parameters/direction.yaml
    - $ref: ../components/parameters/phrase.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  configProfiles:
                    type: array
                    items:
                      $ref: ../components/schemas/hostConfigProfile.yaml
              - $ref: ../components/schemas/meta.yaml
          examples:
            Host Config Profiles Response:
              value:
                $ref: ../components/examples/hostConfigProfiles.json
    '403':
      description: The caller does not hold the infrastructure admin role.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            success: false
            msg: Access Denied
    '404':
      description: Host not found, or the host type does not support configuration profiles.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            success: false
            msg: Host configuration profiles are only supported for MVM server types
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml

post:
  summary: Capture a Host Configuration Profile
  description: |
    Captures a new Host Configuration Profile for a specific host. The current
    host configuration is serialized and stored under the supplied `name` and
    optional `description`.

    This endpoint requires the **infrastructure admin** role.

    Host Configuration Profiles are only supported for MVM server types. A `404`
    with a descriptive message is returned for non-MVM server types.
  operationId: createHostConfigProfile
  tags:
    - Hosts
  parameters:
    - $ref: ../components/parameters/serverId-path.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - configProfile
          properties:
            configProfile:
              $ref: ../components/schemas/hostConfigProfileCreate.yaml
        examples:
          Host Config Profile Create Request:
            value:
              $ref: ../components/examples/hostConfigProfileCreate.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              id:
                type: integer
                format: int64
              configProfile:
                $ref: ../components/schemas/hostConfigProfile.yaml
          examples:
            Host Config Profile Create Response:
              value:
                $ref: ../components/examples/hostConfigProfile.json
    '403':
      description: The caller does not hold the infrastructure admin role.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            success: false
            msg: Access Denied
    '404':
      description: Host not found, or the host type does not support configuration profiles.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            success: false
            msg: Host configuration profiles are only supported for MVM server types
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml

