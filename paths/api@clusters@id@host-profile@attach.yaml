put:
  summary: Attach Host Profile to Cluster
  description: Sets the host profile on the cluster and on every host currently in the cluster.
  operationId: attachClusterHostProfile
  tags:
    - Host Profiles
  parameters:
    - $ref: ../components/parameters/clusterId-path.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - profileId
          properties:
            profileId:
              type: integer
              format: int64
              description: ID of the host profile to attach
        example:
          $ref: ../components/examples/clusterHostProfileAttachRequest.json
  responses:
    '200':
      description: Profile attached successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
          example:
            $ref: ../components/examples/success.json
    '400':
      description: profileId missing
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            $ref: ../components/examples/clusterHostProfileProfileIdRequired.json
    '404':
      description: Host profile not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            $ref: ../components/examples/hostProfileNotFound.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
