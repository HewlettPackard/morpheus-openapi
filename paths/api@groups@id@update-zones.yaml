put:
  summary: Updates a Group's Zones
  description: |
    Updates a group's zones.
  operationId: updateGroupsZones
  tags:
    - Groups
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          required:
            - group
          type: object
          properties:
            group:
              type: object
              required:
                - zones
              properties:
                zones: 
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        format: int64
                  description: An array of all the zones assigned to this group.
                  example: [{"id": 1}, {"id": 5}]
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml