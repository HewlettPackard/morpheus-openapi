post:
  summary: Add a Node to an Instance
  description: |
    Adds a node to an instance, using an existing node as the provisioning template.

    For a drifted multi-node instance there is no single configuration to copy, so the
    caller picks the node to clone with `templateContainerId`. Call the add node prompt
    endpoint first to get the candidate nodes and whether a choice is required. For a
    consistent instance `templateContainerId` can be omitted and the standard scale path is
    used.
  operationId: addInstanceNode
  tags:
    - Instances
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            actionId:
              anyOf:
                - type: integer
                  format: int64
                - type: string
              description: |
                Optional ID of the `scaleInstance` action to execute. When omitted, defaults to
                the first available `scaleInstance` action compatible with the template node.
            templateContainerId:
              type: integer
              format: int64
              example: 42
              description: |
                The `containerId` of the existing node whose configuration the new node
                should be built from. Required for a drifted instance; optional for a
                consistent one (defaults to the first container).
            saveAsTemplate:
              type: boolean
              default: false
              description: |
                When true, the chosen node's configuration is persisted as the instance's
                node template so subsequent nodes are provisioned from it without needing
                `templateContainerId` again.
            count:
              type: integer
              minimum: 1
              default: 1
              description: |
                Number of nodes to add. Defaults to the scale action's `minCount` (at least 1).
                Must be `>= minCount`, and must equal `minCount` when `action.countEnabled` is false.
            zoneId:
              type: integer
              format: int64
              description: |
                Target cloud (zone) ID for the new node(s). When the scale action allows cloud
                selection, must be one of the `zones` returned by `add-node-prompt` (defaults to
                `defaultZoneId`). Otherwise must match the template node's or instance's cloud.
  responses:
    '200':
      description: Add node started
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '400':
      description: Add Node failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/successError.yaml
    '404':
      description: Instance not found or insufficient access
      content:
        application/json:
          schema:
            $ref: ../components/schemas/successError.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
