get:
  summary: Get a Key Provider
  description: Retrieves a key provider by its numeric database ID.
  operationId: getKeyProvider
  tags:
    - Infrastructure
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              keyProvider:
                $ref: ../components/schemas/keyProvider.yaml
    '4XX':
      $ref: ../components/responses/keyProviderError.yaml
    '5XX':
      $ref: ../components/responses/keyProviderError.yaml
put:
  summary: Update a Key Provider
  description: >
    Updates a provider's metadata (`name`, `description`, `visibility`) and moves it through its lifecycle with
    `status`.


    To activate a provider, export it (Export a Key Provider) and send `status: active` with the `exportId` from the
    `X-Key-Provider-Export-Id` header of that export. This is allowed from `exported`, and it also confirms a
    version generated by rotating an active provider. An `exported` provider without an `exportId` is refused with
    `export_id_required`, and an `exportId` that is not the latest export is refused with `export_id_stale`.
    `active` can be changed to `disabled`, and `disabled` back to `active` (use Promote a Key Provider to replace
    the scope's current active provider instead). A provider cannot be moved back to `pending` or `exported`; only
    exporting does that. Only one provider can be active for a scope.


    `providerId`, `type`, `refType`, `refId` and `tpmRequired` cannot be changed. Key material and key versions are
    managed by the server. Requires the master tenant and full access to the Infrastructure: Key Providers
    permission.
  operationId: updateKeyProvider
  tags:
    - Infrastructure
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [keyProvider]
          properties:
            keyProvider:
              $ref: ../components/schemas/keyProviderUpdate.yaml
        examples:
          Key Provider Update:
            value:
              keyProvider:
                name: Updated Cluster Encryption Keys
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              keyProvider:
                $ref: ../components/schemas/keyProvider.yaml
    '4XX':
      $ref: ../components/responses/keyProviderError.yaml
    '5XX':
      $ref: ../components/responses/keyProviderError.yaml
delete:
  summary: Delete a Key Provider
  description: >
    Deletes a key provider that nothing depends on. A provider with dependents, meaning encrypted volumes that were
    created under it whether attached or detached, is refused with HTTP 409 and `provider_has_dependents`, and the
    response lists them; see List Key Provider Dependents. Deleting a cluster never deletes or changes its provider.
    Requires the master tenant and full access to the Infrastructure: Key Providers permission.
  operationId: deleteKeyProvider
  tags:
    - Infrastructure
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Provider deleted.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '409':
      description: The provider cannot be deleted while resources depend on it.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/keyProviderDeleteRefused.yaml
          examples:
            Provider Has Dependents:
              value:
                success: false
                msg: Key provider 'Cluster Encryption Keys' is referenced by 1 volume(s) and cannot be deleted
                errors: {}
                reason: provider_has_dependents
                dependents:
                  volumes:
                    total: 1
                    items:
                      - id: 262
                        name: data-disk
                        status: unattached
                        account:
                          id: 1
                          name: Master
                        server: null
                  hidden: 0
    '4XX':
      $ref: ../components/responses/keyProviderError.yaml
    '5XX':
      $ref: ../components/responses/keyProviderError.yaml
