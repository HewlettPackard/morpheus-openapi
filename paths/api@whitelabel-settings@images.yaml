post:
  summary: Update Images
  description: Uploads whitelabel images. Expects multipart form data as the request format, not JSON.
  operationId: updateWhitelabelImages
  tags:
    - Whitelabel Settings
  parameters:
    - $ref: ../components/parameters/accountId.yaml
  requestBody:
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            headerLogo:
              type: string
              format: binary
              description: Header logo image file, valid image types `png|jpg|svg`
            resetHeaderLogo:
              type: boolean
              description: Resets header logo to default
            footerLogo:
              type: string
              format: binary
              description: Footer logo image file, valid image types `png|jpg|svg`
            resetFooterLogo:
              type: boolean
              description: Resets footer logo to default
            loginLogo:
              type: string
              format: binary
              description: Login logo image file, valid image types `png|jpg|svg`
            resetLoginLogo:
              type: boolean
              description: Resets login logo to default
            favicon:
              type: string
              format: binary
              description: Favicon image file, valid image type ico
            resetFavicon:
              type: boolean
              description: Resets favicon to default
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/200-success.yaml
              - type: object
                properties:
                  msg:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: string
          examples:
            Successful Response:
              value:
                $ref: ../components/examples/success.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
