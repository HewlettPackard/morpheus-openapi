put:
  summary: Rename a Virtual Switch
  description: >-
    Renames a virtual switch. This is an asynchronous operation that returns a
    `processId`; poll `GET /api/processes/{processId}` to track host
    orchestration. On validation failure a 400 is returned with
    `{success: false, errors: {field: message}}`.


    Requires Morpheus 9.1.0.
  operationId: renameVirtualSwitch
  tags:
    - Virtual Switches
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/virtualSwitchRename.yaml
        examples:
          Rename Request:
            value:
              $ref: ../components/examples/virtualSwitchRename.json
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/virtualSwitchAsyncSuccess.yaml
          examples:
            Response:
              value:
                $ref: ../components/examples/virtualSwitchAsyncSuccess.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
