post:
  summary: Toggle Maintenance Mode
  description: This endpoint allows toggling the appliance maintenance mode.
  operationId: setApplianceSettingsMaintenanceMode
  tags:
    - Appliance Settings
  parameters:
    - $ref: ../components/parameters/enableMaintenance.yaml
  responses:
    '200':
      description: Successful Response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              enabled:
                type: boolean
                description: Whether maintenance mode is enabled after the toggle
          examples:
            Successful Response:
              value:
                success: true
                enabled: true
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
