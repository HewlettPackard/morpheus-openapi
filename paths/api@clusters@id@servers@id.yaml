delete: 
  summary: Delete a Worker
  description: |
    This endpoint deletes a specified worker from a specified cluster, draining the node first.

    Only Kubernetes clusters remove a member this way. For other cluster types (for example HVM or
    Docker) the request is refused with `400` and a `msg` stating that the cluster type
    `does not support direct removal`; remove the host as a server instead (`DELETE /api/servers/{id}`).
    A failed node is not drained: the request succeeds without removing it.
  operationId: deleteClusterWorker
  tags: 
    -  Clusters
  parameters:
    - $ref: ../components/parameters/clusterId-path.yaml
    - $ref: ../components/parameters/id-path.yaml
    - $ref: ../components/parameters/force.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
          examples:
            Response:
              value:
                $ref: ../components/examples/success.json 
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml