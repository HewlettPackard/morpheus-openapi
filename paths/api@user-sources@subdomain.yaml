put:
  summary: Updates Account Subdomain
  description: |
    Updates the current account subdomain.
  operationId: updateIdentitySourceAccountSubdomain
  tags:
    - Identity Sources
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - subdomain
          properties:
            subdomain:
              type: string
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success.yaml
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
