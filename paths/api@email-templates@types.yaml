get:
  summary: List email template types
  description: |
    Lists available system email template types for create.
  operationId: listEmailTemplateTypes
  tags:
    - Email Templates
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              types:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
          examples:
            Email Template Types Response:
              value:
                success: true
                types:
                  - name: Instance Shutdown Template
                    value: instanceShutdown
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
