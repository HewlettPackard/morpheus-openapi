get:
  summary: Retrieves a Specific Service Plan
  description: |
    Retrieves a specific service plan.
  operationId: getServicePlans
  tags:
    - Service Plans
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            type: object
            properties:
              servicePlan:
                $ref: ../components/schemas/servicePlan.yaml
          examples:
            Service Plan Response:
              value:
                $ref: ../components/examples/servicePlan.json
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
put:
  summary: Updates a Service Plan
  description: |
    Updates a service plan.
  operationId: updateServicePlans
  tags:
    - Service Plans
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - servicePlan
          properties:
            servicePlan:
              type: object
              properties:
                name: 
                  type: string
                  description: Service plan name
                code:
                  type: string
                  description: Service plan code, must be unique
                description:
                  type:
                    - string
                    - 'null'
                  description: Service plan description; null clears it
                regionCode:
                  type:
                    - string
                    - 'null'
                  description: >-
                    The region code of the clouds the plan is offered in, for cloud types whose plans are
                    regional (Amazon, Azure, Alibaba, ...); null clears it, offering the plan in every region.
                visibility:
                  type: string
                  enum:
                    - public
                    - private
                  description: >-
                    Who can see the plan: `public`, every tenant; `private`, the owning tenant and the tenants in
                    `permissions.tenantPermissions.accounts`. Bound as sent on an editable plan; on a plan that
                    is not editable it changes only for the master tenant, on its own or an ownerless plan.
                active:
                  type: boolean
                  description: >-
                    Whether the plan is offered. Bound on every update, and the one property an update binds on
                    a plan that is not editable; the activate and deactivate operations set it as well.
                maxStorage:
                  type: integer
                  format: int64
                  description: Max storage size in bytes
                maxMemory:
                  type: integer
                  format: int64
                  description: Max memory size in bytes
                maxCpu:
                  type: integer 
                  format: int64
                maxCores:
                  type: integer
                  format: int64
                  description: Max cores
                maxDisks:
                  type:
                    - integer
                    - 'null'
                  format: int64
                  description: Max disks allowed; null clears the limit
                provisionType:
                  type: object
                  required:
                    - id
                  properties: 
                    id: 
                      type: integer
                      format: int64
                      description: Provision type ID
                coresPerSocket:
                  type: integer
                  format: int64
                maxGpus:
                  type: integer
                  format: int64
                  description: Max number of GPUs
                customCpu:
                  type: boolean
                  description: Can be used to enable / disable customizable cpu
                customCores:
                  type: boolean
                  description: Can be used to enable / disable customizable cores
                customMaxStorage:
                  type: boolean
                  description: Can be used to enable / disable customizable storage
                customMaxDataStorage:
                  type: boolean
                  description: Can be used to enable / disable customizable extra volumes.
                customMaxMemory:
                  type: boolean
                  description: Can be used to enable / disable customizable memory.
                addVolumes:
                  type: boolean
                  description: Can be used to enable / disable ability to add volumes
                sortOrder:
                  type: integer
                  format: int64
                  description: Sort order
                priceSets:
                  type: array
                  description: List of price sets to include in service plan
                  items: 
                    type: object
                    properties: 
                      id: 
                        type: integer
                        format: int64
                        description: Price Set ID
                permissions:
                  type: object
                  properties:
                    tenantPermissions:
                      type: object
                      properties:
                        accounts:
                          type: array
                          description: >-
                            The tenants that can see the plan when `visibility` is `private`; replaces the
                            current list. The response lists the tenants, the owning tenant included, to
                            master-tenant callers only.
                          items:
                            type: integer
                            format: int64
                            description: ID of the tenant
                    resourcePermissions:
                      type: object
                      description: >-
                        The groups (sites) the plan is offered in for provisioning and reconfiguring. Send it
                        whenever `tenantPermissions` is sent: the tenant update removes every permission record
                        whose tenant is not in the list, the caller's own included, and this object recreates
                        the caller's record (the owner's, when the owner is updating).
                      properties:
                        all:
                          type: boolean
                          description: >-
                            Offer the plan in every group. Omitted, the current value is kept (true for a newly
                            created permission record); send `all: false` explicitly to restrict the plan to
                            `sites`. The older `allSites` key is read only when true; use `all`.
                        sites:
                          type: array
                          description: The groups the plan is offered in when `all` is false.
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                format: int64
                                description: Group ID
                config: 
                  type: object
                  properties: 
                    storageSizeType: 
                      type: string
                      description: Specifies range min / max storage multiplier
                      enum:
                        - gb
                        - mb
                      default: gb
                    memorySizeType: 
                      type: string
                      description: Specifies range min / max memory multiplier
                      enum:
                        - gb
                        - mb
                      default: mb
                    ranges: 
                      type: object
                      properties: 
                        minStorage: 
                          type: integer
                          format: int64
                          description: Custom min storage in GB (unless `storageSizeType` set to mb)
                        maxStorage: 
                          type: integer
                          format: int64
                          description: Custom max storage in GB (unless `storageSizeType` set to mb)
                        minPerDiskSize:
                          type: integer
                          format: int64
                        maxPerDiskSize:
                          type: integer
                          format: int64
                        minMemory: 
                          type: integer
                          format: int64
                          description: Custom min memory in bytes
                        maxMemory: 
                          type: integer
                          format: int64
                          description: Custom max memory in bytes
                        minCores: 
                          type: integer
                          format: int64
                          description: Custom min cores
                        maxCores:
                          type: integer
                          format: int64
                          description: Custom max cores
                        minSockets:
                          type: integer
                          format: int64
                          description: Custom min sockets
                        maxSockets:
                          type: integer
                          format: int64
                          description: Custom max sockets
                        minCoresPerSocket:
                          type: integer
                          format: int64
                          description: Custom min cores allowed per socket
                        maxCoresPerSocket:
                          type: integer
                          format: int64
                          description: Custom max cores allowed per socket
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            allOf:
            - type: object
              properties:
                id:
                  type: integer
                  format: int64
                  description: ID of the updated service plan
            - $ref: ../components/schemas/200-success-expanded.yaml
          examples:
            Service Plan Response:
              value:
                success: true
                id: 1
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
delete:
  summary: Deletes a Service Plan
  description: |
    Soft-deletes a service plan (marks inactive/deleted).
  operationId: removeServicePlans
  tags:
    - Service Plans
  parameters:
    - $ref: ../components/parameters/id-path.yaml
  responses:
    '200':
      description: Successful Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/200-success-expanded.yaml
          examples:
            Delete Service Plan Response:
              value:
                success: true
    '4XX':
      $ref: ../components/responses/4xx.yaml
    '5XX':
      $ref: ../components/responses/5xx.yaml
